# cargo-deny policy for jubarte (plan A4).
# Project is AGPL-3.0-only; allow common permissive deps and AGPL itself.

[graph]
all-features = true
# Target the host triple cargo-deny uses in CI; multi-target not required.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Direct rustybuzz 0.20 (shaping). Unmaintained as of 2026-08; migrating
    # off it is plan Step 2e / PR5 (FaceKey registry), not a CI ignore-forever.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; migrate with FaceKey/harfbuzz in plan 2e" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained: direct dep (glyph metrics, TTF embed) and via rustybuzz 0.20; same 2e migration" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "OpenSSL",
    "BSL-1.0",
    "bzip2-1.0.6",
    # webpki-roots (Mozilla's CA root list), pulled in by `self-update`'s
    # rustls client: a permissive data license.
    "CDLA-Permissive-2.0",
]

[bans]
# A new duplicate fails the build. The skips are the duplicates already in
# the graph; each one is a real split (two major versions of one crate),
# not a blanket warning.
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
# Deny path/git deps in published graph (keep builds reproducible).
allow-wildcard-paths = true
skip = [
    # 0.2 via ring/rustls, 0.3 and 0.4 via tempfile and uuid.
    { name = "getrandom" },
    # rustix 0.38 still needs 2.x; newer rustix needs 3.x.
    { name = "io-lifetimes" },
    # flate2 and zip do not share one miniz_oxide major.
    { name = "miniz_oxide" },
    # rdocx-opc stays on patched 0.41; the engine reads 0.42.
    { name = "quick-xml" },
    # proc-macro crates have not all moved from syn 2 to syn 3.
    { name = "syn" },
    # windows crates still mix 0.52 and 0.61.
    { name = "windows-sys" },
    # The Windows target triples pull a second windows-targets set beside the host one.
    { name = "windows-targets" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/jandira-tech/ooxmlsdk"]

# Closed inventory of crates whose build scripts may run. This list is
# an inventory, not a sandbox: cargo-deny does not constrain what the
# scripts execute. libmimalloc-sys compiles mimalloc's C and is the
# reviewed exception for default fast-alloc. ring, alloca, and
# libfuzzer-sys also compile C; pyo3-ffi links libpython. The other
# names are cfg or rustc probes. Procedural macros appear here only
# when they also have a build script. Published crates in this list
# shipped no native executable under the default executable lint.
[bans.build]
# Scan this crate too. The checksum bypass below skips the walk while
# build.rs is unchanged, so the root check and the nested graphs agree.
include-workspace = true
allow-build-scripts = [
    "ahash",
    "alloca",
    "cap-primitives",
    "cap-std",
    # zip 9.4.2 depends on this crate. Its build script only sets rustc cfgs.
    "constant_time_eq",
    "crc32fast",
    "crossbeam-deque",
    "crossbeam-epoch",
    "crossbeam-utils",
    "curve25519-dalek",
    "encoding_rs",
    "getrandom",
    "httparse",
    "io-extras",
    "io-lifetimes",
    "jsonschema-value",
    "jubarte-redlines",
    "libc",
    "libfuzzer-sys",
    "libm",
    "libmimalloc-sys",
    "nix",
    "num-traits",
    "parking_lot_core",
    "proc-macro2",
    "pulldown-cmark",
    "pyo3",
    "pyo3-ffi",
    "pyo3-macros-backend",
    "quote",
    "rayon-core",
    "ref-cast",
    "ring",
    "rustix",
    "rustls",
    "rustversion",
    "self_update",
    "serde",
    "serde_core",
    "serde_json",
    "target-lexicon",
    "thiserror",
    "unicode-general-category",
    "wasm-bindgen",
    "wasm-bindgen-shared",
    "winapi",
    "windows_x86_64_gnu",
    "windows_x86_64_msvc",
    "zerocopy",
    "zmij",
]

# This package root is the repository, so the file walk would treat
# unrelated tools and local environments as crate files. The build
# script only records the version. The checksum skips that walk until
# the script itself changes.
[[bans.build.bypass]]
name = "jubarte-redlines"
build-script = "e0180992bf7eeb204ceac3cf8882d78a0acbca893149f5079c1458fcb45d1050"

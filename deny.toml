# cargo-deny policy for jubarte (plan A4).
# Project is AGPL-3.0-only; allow common permissive deps and AGPL itself.

[graph]
all-features = true
# Target the host triple cargo-deny uses in CI; multi-target not required.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "warn"
# No fixed rdocx-opc release exists. The engine bounds OPC metadata to
# 256 attributes BEFORE every upstream parse (src/opc/mod.rs regression test).
# NsReader is not used by rdocx-opc. These exceptions do not claim the
# dependency itself is fixed; direct use of its re-exported parsers is unsafe
# on untrusted input. Reassess by 2026-11-06; remove on upstream upgrade.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "engine OPC preflight bounds attributes to 256; reassess 2026-11-06; see SECURITY.md" },
    { id = "RUSTSEC-2026-0195", reason = "rdocx-opc uses Reader, not affected NsReader; reassess 2026-11-06" },
    # Direct rustybuzz 0.20 (shaping). Unmaintained as of 2026-08; migrating
    # off it is plan Step 2e / PR5 (FaceKey registry), not a CI ignore-forever.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; migrate with FaceKey/harfbuzz in plan 2e" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained: direct dep (glyph metrics, TTF embed) and via rustybuzz 0.20; same 2e migration" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "OpenSSL",
    "BSL-1.0",
    "bzip2-1.0.6",
    # webpki-roots (Mozilla's CA root list), pulled in by `self-update`'s
    # rustls client: a permissive data license.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Deny path/git deps in published graph (keep builds reproducible).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

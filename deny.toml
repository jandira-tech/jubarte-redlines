# cargo-deny policy for jubarte (plan A4).
# Project is AGPL-3.0-only; allow common permissive deps and AGPL itself.

[graph]
all-features = true
# Target the host triple cargo-deny uses in CI; multi-target not required.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "warn"
# Transitive quick-xml 0.37 via rdocx-opc (pinned to "0.37"); our direct
# dependency is quick-xml ≥ 0.41. No fixed rdocx-opc release yet — revisit
# when upstream bumps. Risk is untrusted XML DoS via NsReader, not code exec.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "transitive quick-xml 0.37 via rdocx-opc; direct dep is 0.41+" },
    { id = "RUSTSEC-2026-0195", reason = "transitive quick-xml 0.37 via rdocx-opc; direct dep is 0.41+" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "OpenSSL",
    "BSL-1.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Deny path/git deps in published graph (keep builds reproducible).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

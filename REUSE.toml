# Installable fonts (scripts/install.sh copies them into the per-user font
# folder; the binary does not embed them).
# Word draws Roboto Condensed from its cloud-font cache; these are those
# exact files (name table: "Licensed under the Apache License, Version 2.0").
[[annotations]]
path = "assets/fonts/extra/RobotoCondensed-*.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2011 Google Inc."
SPDX-License-Identifier = "Apache-2.0"

# Selawik: Microsoft's open, metric-compatible stand-in for Segoe UI.
[[annotations]]
path = "assets/fonts/extra/Selawik-*.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2015 Microsoft Corporation"
SPDX-License-Identifier = "OFL-1.1"

# Third-party manuscripts used as Markdown round-trip inputs. Not licensed
# by Jandira; provenance is in LICENSES/LicenseRef-Manuscript-Fixtures.txt.
[[annotations]]
path = ["tests/fixtures/md-roundtrip/dolphins.md", "tests/fixtures/md-roundtrip/eLife.00047.md", "tests/fixtures/md-roundtrip/git_manuscript.md", "tests/fixtures/md-roundtrip/list_of_figures.md"]

[[annotations]]
path = ["tests/corpus/neurotic_docx_bench/**", "tests/corpus/_to_improve_accepted_changes/**"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Bench-Fixtures"

[package]
name = "jubarte-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jubarte-redlines = { path = "..", default-features = false }
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# Install the same global allocator as the shipped CLI. Invoke through
# scripts/fuzz-native.sh so the C allocator is instrumented as well as Rust.
native-allocator = ["dep:mimalloc", "jubarte-redlines/fast-alloc"]

# A standalone package, like the bindings: the root `[workspace]` is empty.
[workspace]

[[bin]]
name = "admit"
path = "fuzz_targets/admit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strict_to_transitional"
path = "fuzz_targets/strict_to_transitional.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compare"
path = "fuzz_targets/compare.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relationships"
path = "fuzz_targets/relationships.rs"
test = false
doc = false
bench = false

# ReadTheDocs project "jubarte-markdown": its Admin > Settings > "Build configuration
# file" is docs/rtd/jubarte-markdown/.readthedocs.yaml (docs/rtd/README.md). Paths are
# relative to the repository root. docs/rtd/build.sh downloads the pinned
# mdBook, checks its sha256 and writes the HTML where ReadTheDocs serves it.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - bash docs/rtd/build.sh jubarte-markdown "$READTHEDOCS_OUTPUT/html"

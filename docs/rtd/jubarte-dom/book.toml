# Build with `docs/rtd/build.sh jubarte-dom`: it pins mdBook and sets the
# repository and "edit this page" links from Cargo.toml's
# [workspace.package] repository, so this file names no repository URL.
[book]
title = "jubarte-dom"
authors = ["Jandira Technologies, LLC"]
language = "en"
src = "src"

[build]
# A SUMMARY.md entry without its file is an error, not a new empty page.
create-missing = false

[rust]
edition = "2024"

[output.html]

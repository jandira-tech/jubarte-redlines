# Categories for GitHub's generated release notes. scripts/release.sh writes
# the release notes from CHANGELOG.md; this shapes the "What's changed" list
# GitHub offers beside them.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels: ["breaking"]
    - title: Word parity
      labels: ["word-parity"]
    - title: Features
      labels: ["enhancement"]
    - title: Fixes
      labels: ["bug"]
    - title: Security
      labels: ["security"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]

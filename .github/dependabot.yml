# Weekly version updates. An empty package-ecosystem is rejected by
# Dependabot, so each ecosystem the repository ships is named here.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/jubarte-python"
      - "/jubarte-wasm"
      - "/jubarte-rust-inproc"
      - "/jubarte-app/src-tauri"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

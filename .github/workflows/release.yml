# Tag-driven release: push `vX.Y.Z` (see VERSIONING.md) and this builds the
# `jubarte` CLI for the five desktop targets and attaches the archives to a
# GitHub release named `jubarte vX.Y.Z`, with the matching CHANGELOG.md
# section as the release notes.
#
# Third-party actions are pinned to commit SHAs with the resolved release tag
# as a trailing comment (Dependabot bumps both); see ci.yml for the
# dtolnay/rust-toolchain branch-pin convention.
name: Release

on:
  push:
    tags: ["v*"]

# The release job publishes; the build jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says ${ver} — run scripts/bump-version.mjs ${tag} first"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  binaries:
    name: jubarte ${{ matrix.artifact }}
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      # Git for Windows stops at MAX_PATH (260) without core.longpaths; the
      # v0.10.1 checkout failed on bench fixture paths and skipped the release.
      # tests/repo_paths_fit_windows.rs keeps tracked paths short as well.
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked --bin jubarte --target ${{ matrix.target }}

      - name: Stage archive (unix)
        if: runner.os != 'Windows'
        env:
          VER: ${{ needs.version.outputs.version }}
          ART: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="jubarte-${VER}-${ART}"
          mkdir -p "$stage/fonts" dist
          cp "target/${TARGET}/release/jubarte" "$stage/"
          cp LICENSE "$stage/"
          # The faces Word draws that non-Windows hosts lack. The binary does
          # not embed them; it reads $JUBARTE_FONT_DIR or the per-user dir.
          cp assets/fonts/extra/*.ttf "$stage/fonts/"
          {
            echo "Copy these fonts into \$JUBARTE_FONT_DIR, or into the per-user"
            echo "jubarte fonts directory (scripts/install.sh --fonts-only does"
            echo "this from a source checkout):"
            echo "  macOS   ~/Library/Application Support/jubarte/fonts"
            echo "  Linux   \$XDG_DATA_HOME/jubarte/fonts (default ~/.local/share/jubarte/fonts)"
            echo ""
            echo "RobotoCondensed-*.ttf — Apache-2.0 — (c) 2011 Google Inc."
            echo "Selawik-*.ttf         — OFL-1.1   — (c) 2015 Microsoft Corporation"
          } > "$stage/fonts/NOTICE.txt"
          tar -czf "dist/${stage}.tar.gz" "$stage"

      - name: Stage archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VER: ${{ needs.version.outputs.version }}
          ART: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          $stage = "jubarte-$env:VER-$env:ART"
          New-Item -ItemType Directory -Force "$stage/fonts", dist | Out-Null
          Copy-Item "target/$env:TARGET/release/jubarte.exe" "$stage/"
          Copy-Item LICENSE "$stage/"
          Copy-Item assets/fonts/extra/*.ttf "$stage/fonts/"
          @"
          Copy these fonts into %JUBARTE_FONT_DIR%, or into the per-user
          jubarte fonts directory: %APPDATA%\jubarte\fonts

          RobotoCondensed-*.ttf - Apache-2.0 - (c) 2011 Google Inc.
          Selawik-*.ttf         - OFL-1.1   - (c) 2015 Microsoft Corporation
          "@ | Set-Content "$stage/fonts/NOTICE.txt"
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jubarte-${{ needs.version.outputs.version }}-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # PyPI abi3 wheels for the platforms README advertises. The release job
  # attaches them to the GitHub release; scripts/release.sh re-uploads the
  # same files to PyPI, so wheels are built once, on clean CI machines.
  wheels:
    name: wheel ${{ matrix.artifact }}
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            artifact: manylinux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
            artifact: manylinux-aarch64
          - os: macos-15-intel
            target: x86_64
            artifact: macos-x86_64
          - os: macos-latest
            target: aarch64
            artifact: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: jubarte-python
          sccache: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ needs.version.outputs.version }}-${{ matrix.artifact }}
          path: jubarte-python/dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, binaries, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # previous tag → "Full Changelog" compare link
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jubarte-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # Signed archives (docs/SELF_UPDATE.md, "Signed releases"). Signing
      # rewrites each archive, so it runs before Checksums; it also runs
      # before the sdist step, so no third-party code of this job runs ahead
      # of it, and the key reaches this step only. zipsign signs with the
      # file name as its context, which is the asset name the updater checks.
      # The secret holds one base64 private key per line (two while keys
      # rotate). Without it the archives stay unsigned (checksum only) until
      # a public key is committed under keys/; from then on every release
      # must be signed, and a missing secret fails the release.
      - name: Sign archives
        env:
          ZIPSIGN_PRIVATE_KEY: ${{ secrets.ZIPSIGN_PRIVATE_KEY }}
          ZIPSIGN_VERSION: "0.2.1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          pubs=(keys/*.pub)
          if [ -z "$ZIPSIGN_PRIVATE_KEY" ]; then
            if [ "${#pubs[@]}" -gt 0 ]; then
              echo "::error::keys/ holds a release public key but the ZIPSIGN_PRIVATE_KEY secret is not set; signed-era binaries would refuse this release"
              exit 1
            fi
            echo "ZIPSIGN_PRIVATE_KEY is not set: the archives stay unsigned (checksum only)."
            exit 0
          fi
          cargo install zipsign --locked --version "$ZIPSIGN_VERSION"
          keydir="$(mktemp -d "$RUNNER_TEMP/zipsign.XXXXXX")"
          trap 'rm -rf "$keydir"' EXIT
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line//[$'\t\r ']/}"
            [ -n "$line" ] || continue
            n=$((n + 1))
            printf '%s' "$line" | base64 -d > "$keydir/key$n"
            if [ "$(wc -c < "$keydir/key$n")" -ne 64 ]; then
              echo "::error::line $n of ZIPSIGN_PRIVATE_KEY is not one base64 zipsign private key (64 bytes)"
              exit 1
            fi
          done <<< "$ZIPSIGN_PRIVATE_KEY"
          keys=("$keydir"/key*)
          archives=(dist/jubarte-*.tar.gz dist/jubarte-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no release archives in dist/ to sign"
            exit 1
          fi
          for a in "${archives[@]}"; do
            case "$a" in
              *.tar.gz) kind=tar ;;
              *.zip) kind=zip ;;
            esac
            # In place, no --context: the context is the file name.
            zipsign sign "$kind" "$a" "${keys[@]}"
            # Every committed public key must accept every archive, so a
            # secret that does not match keys/ stops the release here.
            for pub in "${pubs[@]}"; do
              zipsign verify "$kind" "$a" "$pub"
            done
            echo "signed ${a#dist/}"
          done

      - name: PyPI sdist
        run: |
          set -euo pipefail
          pipx run maturin sdist --manifest-path jubarte-python/Cargo.toml --out dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Body of the `## [VER] - date` section, up to the next heading.
          awk -v ver="$VER" '
            index($0, "## [" ver "] - ") == 1 { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no CHANGELOG.md section for ${VER}"
            exit 1
          fi
          # scripts/release.sh puts --github-summary in the annotated tag
          # body; it leads the release notes when present. actions/checkout
          # leaves the tag lightweight (actions/checkout#290), so fetch the
          # annotated tag object before reading its body.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          body="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" 2>/dev/null || true)"
          if [ -n "$body" ]; then
            { printf '%s\n\n' "$body"; cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
          fi
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${{ github.repository }}" "$prev" "$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pre=""
          case "$VER" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "jubarte v${VER}" \
            --notes-file notes.md \
            $pre \
            dist/*

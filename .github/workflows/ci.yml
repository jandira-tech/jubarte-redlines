name: CI

# Third-party actions are pinned to commit SHAs; the trailing comment names
# the release tag the SHA was resolved from so Dependabot (github-actions,
# weekly) can bump both together. dtolnay/rust-toolchain is pinned to a
# branch head (its `stable`/`master` branches are the published interface),
# so the comment carries the branch and the pin date instead of a version.

on:
  push:
    branches: [main, pre-release]
  pull_request:

# Every job only reads the repo; anything not listed here is `none`.
# One run per PR (or branch): a new push cancels the PR's older run, and
# on main a newer commit replaces any run still waiting. The self-hosted
# runners are few, so superseded runs must not hold the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables keep file:line in backtraces at a fraction of full debug
  # info's size. The mbx action sets the same on the self-hosted runners;
  # here it also bounds the jobs that build without mbx (the Windows test
  # leg ran out of disk linking the test binaries with full debug info).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: fmt + clippy
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
        with:
          components: rustfmt, clippy
          # jubarte-wasm is linted for the target it ships on.
          targets: wasm32-unknown-unknown
      # mbx's cache server is on the self-hosted network; GitHub's
      # runners (LINUX_RUNNER=ubuntu-latest) use rust-cache instead.
      - if: (vars.LINUX_RUNNER || 'self-hosted') == 'self-hosted'
        uses: ./.github/actions/mbx
      - if: (vars.LINUX_RUNNER || 'self-hosted') != 'self-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      # Every workspace, as release.sh step 5 checks them (#1760): the root
      # check never reads jubarte-wasm, jubarte-python, jubarte-rust-inproc or fuzz.
      - run: |
          for m in jubarte-wasm jubarte-python jubarte-rust-inproc fuzz; do
            cargo fmt --all --manifest-path "$m/Cargo.toml" --check
          done
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The library without the `cli` feature (clap) must still build: a
      # library path once called into the CLI module and only --all-features ran.
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # Each crate alone, on its own default features. `--workspace` cannot:
      # the root enables `render` on the layers, and feature unification
      # hides what only builds without it (#2450: the audit compiled out of
      # jubarte-doc, so 0.19.0's slim npm build lost auditDocument). The
      # library alone is what a registry user builds; `--all-targets` adds
      # the dev-dependencies, which turn `render` back on below some crates
      # (jubarte-markdown and jubarte-edit test against jubarte-doc/render).
      - run: |
          for p in jubarte-dom jubarte-opc jubarte-redlines jubarte-render jubarte-doc jubarte-markdown jubarte-edit jubarte-cli; do
            cargo clippy -p "$p" -- -D warnings
            cargo clippy -p "$p" --all-targets -- -D warnings
          done
      # No network crate without self-update, and no network API outside
      # the self-update code (#2018): Word fetches remote templates on open; jubarte
      # must not. Here, not in the scripts job, because it runs cargo tree.
      - run: python3 scripts/test_check_no_network.py
      - run: python3 scripts/check_no_network.py
      # The two rustdoc builds scripts/release.sh runs (steps 5 and 6): 0.13
      # reached its release with 39 broken intra-doc links nothing had built.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # jubarte-doc's docs on its default features: a link to a render-only
      # item breaks only there, and docs.rs builds all features.
      - run: cargo doc -p jubarte-doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The bindings are not members of the root workspace (`[workspace]` in
      # Cargo.toml is empty and each binding declares its own), so
      # `--workspace` would not reach them. Each is linted from its own
      # directory, which also makes cargo read jubarte-wasm/.cargo/config.toml
      # (the wasm RUSTFLAGS recipe).
      - name: clippy jubarte-rust-inproc
        working-directory: jubarte-rust-inproc
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy jubarte-python
        # pyo3 (abi3, extension-module) only needs an interpreter to configure
        # itself, and clippy links nothing, so the runner's python3 is enough.
        working-directory: jubarte-python
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy jubarte-wasm (wasm32-unknown-unknown)
        working-directory: jubarte-wasm
        # `-- -D warnings` reaches only the top crate. RUSTFLAGS also denies
        # the warnings of the engine it builds for wasm32 (#1700); crates.io
        # dependencies stay capped.
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --all-features --target wasm32-unknown-unknown -- -D warnings
      # The narrow npm builds (plan T5.2), with the features build-npm.sh
      # gives them: a helper only a wider layer uses is dead code there.
      - name: clippy jubarte-wasm narrow builds (wasm32-unknown-unknown)
        working-directory: jubarte-wasm
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo clippy --no-default-features --features slim,console-panic --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --no-default-features --features redlines,console-panic --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --no-default-features --features pdf,console-panic --target wasm32-unknown-unknown -- -D warnings
      # The desktop app is its own repository (arthrod/jubarte-app): its CI
      # lints, tests and builds it against this engine.

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ["${{ vars.LINUX_RUNNER || 'self-hosted' }}", macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # tests/corpus keeps the bench's file names, some past Windows'
      # 260-character path limit.
      - run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
      - if: matrix.os == 'self-hosted'
        uses: ./.github/actions/mbx
      - if: matrix.os != 'self-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov tag, pinned 2026-10-01
        with:
          tool: cargo-nextest
      # Every failing test, not just the first binary's (the `ci` profile
      # does not fail fast), with JUnit XML for Codecov's test results.
      # The strict Markdown round trip is red until the reader work lands
      # (spec 2026-10-13 §5.4); the `roundtrip` job below is its gate, so this job
      # keeps reporting every other test.
      - run: cargo nextest run --workspace --all-features --profile ci -E 'not test(markdown_and_docx_round_trip_exactly)'
      # nextest runs no doctests.
      - run: cargo test --workspace --all-features --doc
      # jubarte-doc's own tests without `render`: the `--all-features` run
      # above never takes the no-layout paths (no pass, `layout: false`).
      # Default profile, so the JUnit report it wrote is not overwritten.
      - run: cargo nextest run -p jubarte-doc
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
      # The wasm binding is its own workspace: its unit tests call the
      # exports as Rust, natively. Left out, a stale one went unseen.
      - name: test jubarte-wasm
        working-directory: jubarte-wasm
        run: |
          cargo test --lib
          cargo test --lib --no-default-features --features slim

  coverage:
    name: coverage
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    # rust-toolchain.toml names stable; this job needs nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master branch, pinned 2026-10-01
        with:
          toolchain: nightly
          # Branch instrumentation and doctest coverage require nightly.
          # Production remains supported by the separate stable/MSRV jobs.
          components: llvm-tools-preview
      # mbx's cache server is on the self-hosted network; GitHub's
      # runners (LINUX_RUNNER=ubuntu-latest) use rust-cache instead.
      - if: (vars.LINUX_RUNNER || 'self-hosted') == 'self-hosted'
        uses: ./.github/actions/mbx
      - if: (vars.LINUX_RUNNER || 'self-hosted') != 'self-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Downloads a prebuilt binary instead of `cargo install` (minutes → seconds).
      # install-action picks the tool from the ref (`@cargo-llvm-cov`) or, as
      # here with the ref pinned to a commit SHA, from the `tool` input.
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov tag, pinned 2026-10-01
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        # Run every test, including doctests. Only cfg(test) implementation
        # is excluded from instrumentation; all production code is counted.
        run: cargo llvm-cov --all-features --workspace --branch --doctests --lcov --output-path lcov.info -- --skip markdown_and_docx_round_trip_exactly

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          # Public repo, so uploads work tokenless — but tokenless is rate-limited
          # and can drop reports. The secret is used when present.
          token: ${{ secrets.CODECOV_TOKEN }}
          # A silently-missing report is worse than a red build: it looks like
          # coverage simply didn't change.
          fail_ci_if_error: true
          verbose: true

      - name: Production coverage floors (95% lines, 88% branches)
        run: |
          # `report` takes no --workspace: name every member, or the report
          # shrinks to the root package (src/bin/ only, as it did after the
          # 0.19.0 split). The gate refuses a report missing any member.
          cargo metadata --no-deps --format-version 1 > metadata.json
          packages=()
          while IFS= read -r name; do packages+=(-p "$name"); done \
            < <(jq -r '.workspace_members as $m | .packages[] | select(.id as $i | $m | index($i)) | .name' metadata.json)
          cargo llvm-cov report --branch --json "${packages[@]}" --output-path coverage.json
          python3 scripts/coverage_gate.py coverage.json metadata.json

  msrv:
    name: MSRV (1.94)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    # rust-toolchain.toml names stable; without this the job would test
    # stable and call it the MSRV.
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # master branch: the toolchain comes from the input below, not the ref.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master branch, pinned 2026-10-01
        with:
          toolchain: "1.94"
      # mbx's cache server is on the self-hosted network; GitHub's
      # runners (LINUX_RUNNER=ubuntu-latest) use rust-cache instead.
      - if: (vars.LINUX_RUNNER || 'self-hosted') == 'self-hosted'
        uses: ./.github/actions/mbx
      - if: (vars.LINUX_RUNNER || 'self-hosted') != 'self-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov tag, pinned 2026-10-01
        with:
          tool: cargo-nextest
      # The whole suite, not `cargo check`: README.md promises MSRV *testing*,
      # and dev-dependencies and test-only code are exactly what a compile
      # check of the library skips. One Linux run on the declared
      # `rust-version` (Cargo.toml) beside the three stable runs above.
      # The strict Markdown round trip is red until the reader work lands
      # (spec 2026-10-13 §5.4); the `roundtrip` job below is its gate, so this job
      # keeps reporting every other test.
      - run: cargo nextest run --workspace --all-features --no-fail-fast -E 'not test(markdown_and_docx_round_trip_exactly)'
      # nextest runs no doctests.
      - run: cargo test --workspace --all-features --doc

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    # rust-toolchain.toml names stable; the sanitizers need nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
    # Four ordinary runs, two native runs, and a cold instrumented C build.
    # A cold sanitizer build of jubarte takes 13 min on a free M-series Mac
    # and over 25 min on the shared self-hosted runners: under the old
    # 30-minute bound every run since 2026-10-17 was cancelled inside the
    # build, and a cancelled job never saves its cache, so every next run
    # started cold again. 90 minutes lets a cold run finish and save it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # master branch: the toolchain comes from the input below, not the ref.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master branch, pinned 2026-10-01
        with:
          toolchain: nightly
      # Not mbx: under it the sanitizer build of jubarte-fuzz stalled past
      # the timeout twice on 2026-10-17, and mbx bypasses the instrumented C.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          # A fuzzer that finds a crash fails the job; keep the build anyway.
          cache-on-failure: true
      - run: cargo install cargo-fuzz --locked
      - run: ./fuzz/seed.sh
      # Every target in one build, timed on its own step; the runs below
      # then start at once instead of hiding the build inside `admit`.
      - run: cargo fuzz build
      - run: cargo fuzz run admit -- -max_total_time=60
      # Run every target even if an earlier one found a crash.
      - if: ${{ !cancelled() }}
        run: cargo fuzz run strict_to_transitional -- -max_total_time=60
      - if: ${{ !cancelled() }}
        run: cargo fuzz run compare -- -max_total_time=60
      - if: ${{ !cancelled() }}
        run: cargo fuzz run relationships -- -max_total_time=60
      # Exercise the shipped native allocator with C instrumentation and
      # mimalloc's ASan allocation hooks as well as Rust ASan. That needs
      # upstream clang, which the self-hosted Linux image does not carry
      # (the native runs exited 127 once the build stopped timing out).
      - if: ${{ !cancelled() }}
        run: |
          if ! command -v clang >/dev/null || ! command -v clang++ >/dev/null; then
            SUDO=$([ "$(id -u)" = 0 ] || echo sudo)
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends clang
          fi
          clang --version | head -1
      - if: ${{ !cancelled() }}
        run: bash scripts/fuzz-native.sh compare -max_total_time=60
      - if: ${{ !cancelled() }}
        run: bash scripts/fuzz-native.sh relationships -max_total_time=60
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-reproducers
          path: fuzz/artifacts/
          if-no-files-found: ignore

  package:
    name: publish dry run
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
      # Blacksmith runners cannot reach the self-hosted mbx cache server.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every crate packaged and verified from its tarball (plan T6.1), in a
      # fresh target directory so no earlier unpacked crate is reused.
      - name: publish dry run (all nine crates)
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "jubarte"))')
          scripts/publish_crates.sh "$ver" --dry-run

  # The public API of each published crate against its last release.
  # It reports and does not block until 1.0: a 0.x minor may break, and a
  # crate with no release yet has nothing to compare with.
  semver:
    name: semver check (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  python:
    name: python bindings
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
      # Blacksmith runners cannot reach the self-hosted mbx cache server.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: jubarte-python
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: build the extension and run pytest
        working-directory: jubarte-python
        run: |
          uv run --with maturin maturin develop --release
          uv run --with pytest --with 'mcp>=2.2,<3' --with anyio pytest -q
      # Each feature layer of the binding compiles alone (plan T5.3).
      - name: check every feature layer alone
        working-directory: jubarte-python
        run: |
          for f in redlines doc markdown edit cli render; do
            cargo check --locked --no-default-features --features "$f"
          done
      # A source install compiles the sdist; cargo metadata passes on one
      # missing a declared target file, cargo check does not (#2448).
      - name: build the sdist and compile it unpacked
        run: |
          out="$RUNNER_TEMP/sdist"
          uvx maturin sdist --manifest-path jubarte-python/Cargo.toml --out "$out"
          tar -xzf "$out"/*.tar.gz -C "$out"
          cargo check --locked --manifest-path "$(ls -d "$out"/jubarte_docx-*/)jubarte-python/Cargo.toml"

  convert-sweep-unit:
    name: convert-sweep unit
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # Python 3.12 is the scripts' floor, so they are tested on it. The
      # runner's system Python is older; uv installs 3.12 and puts its venv
      # first on PATH, so every `python3` below is 3.12.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
          venv-path: ${{ runner.temp }}/scripts-py
      - name: python3 is 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)'
      - run: python3 scripts/test_convert_sweep.py
      - run: python3 scripts/test_release_sh.py
      - run: python3 scripts/test_publish_crates.py
      - run: python3 scripts/test_glibc_floor.py
      - run: python3 scripts/test_gen_docs.py
      # pyyaml for the four workflow-review tests: hash-verified wheels only.
      - run: uv pip install --no-build --require-hashes -r scripts/ci-requirements.txt
      - run: python3 scripts/test_release_workflow.py
      - run: python3 scripts/test_docs_workflow.py
      - run: python3 scripts/test_jules_workflow.py
      - run: python3 scripts/test_codeql_config.py
      - run: python3 scripts/test_ci_runners.py
      - run: python3 scripts/test_coverage_gate.py
      - run: python3 scripts/test_check_engine_commit.py
      - run: python3 scripts/test_check_npm_paths.py
      - run: python3 scripts/test_table_styles_asset.py
      # The committed npm packages name no builder's home (#1480): the
      # library's artifacts and the CLI package's modules.
      - run: python3 scripts/check_npm_paths.py jubarte-wasm/npm jubarte-wasm/cli
      - name: Oracle dependency and advisory record tests with coverage
        run: |
          uv run --with coverage coverage run --branch --include='scripts/test_oracle_dependency.py' scripts/test_oracle_dependency.py
          uv run --with coverage coverage report
      - name: OpenSSF attestation script tests with coverage
        run: |
          uv run --with coverage coverage run --branch --include='scripts/openssf_attest.py' scripts/test_openssf_attest.py
          uv run --with coverage coverage report --fail-under=90
      - run: python3 scripts/test_check_release_info.py
      - run: python3 scripts/test_library_readmes.py
      # The README gate itself, on every PR: docs.yml runs it only when its
      # paths change, and a new `pub mod` in crates/*/src/lib.rs or an
      # edited //! example is not among them.
      - run: python3 scripts/library_readmes.py --check
      - run: python3 scripts/test_cli_locations.py
      - run: python3 scripts/test_stack1m.py
      - run: python3 scripts/test_check_release_artifacts.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: python3 scripts/test_bump_version.py
      - run: python3 scripts/test_gemini_extension.py
      - run: python3 scripts/test_api_snapshot.py
      - run: python3 scripts/check_links.py
      - run: python3 scripts/sync_license_files.py --check
      - run: python3 scripts/test_pulldown_cmark_lock.py
      - run: python3 scripts/test_gen_cli_docs_version.py
      # `npx jubarte-redlines` over the checked-in jubarte-wasm build.
      # node:test and the ESM cli need node >= 18 (cli engines >= 18.3); the
      # self-hosted runner's system node is far older, so set one up.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test jubarte-wasm/cli/test/*.test.mjs
      - run: node --test scripts/bump-version.test.mjs

  # Strict: every Markdown fixture in our dialect (tests/fixtures/md-roundtrip/*.md)
  # must come back exactly after md -> docx -> md, and every docx listed in
  # tests/fixtures/md-roundtrip/docx.txt must print the same Markdown after
  # docx -> md -> docx -> md (tests/md_fixed_point.rs). There is no list of
  # known failures: the job fails until the round trip is exact
  # (docs/IDS_AND_MARKDOWN_ROUNDTRIP.md §0).
  roundtrip:
    name: md -> docx -> md, exact
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
      # Blacksmith runners cannot reach the self-hosted mbx cache server.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-features --test md_fixed_point

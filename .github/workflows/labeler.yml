name: Labeler

# Labels a pull request by the paths it changes (.github/labeler.yml).
# pull_request_target runs with the base branch's workflow and checks out
# no pull request code, so a fork cannot change what runs here.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false

name: Docs

# The generated blocks in docs/rust.md, docs/python.md and docs/javascript.md
# (CLI references from real --help output, API references from the shipped
# module/declaration files) must never drift from the code. This job
# regenerates them and fails when the committed pages differ.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - src/**
      - jubarte-python/**
      - jubarte-wasm/**
      - docs/rust.md
      - docs/python.md
      - docs/javascript.md
      - scripts/gen_docs.sh
      - scripts/gen_cli_docs.py
      - scripts/gen_python_api.py
      - scripts/gen_wasm_api.py
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - src/**
      - jubarte-python/**
      - jubarte-wasm/**
      - docs/rust.md
      - docs/python.md
      - docs/javascript.md
      - scripts/gen_docs.sh
      - scripts/gen_cli_docs.py
      - scripts/gen_python_api.py
      - scripts/gen_wasm_api.py

permissions:
  contents: read

jobs:
  drift:
    name: generated docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: jubarte-python
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # node is preinstalled on ubuntu-latest; the generator only needs it to
      # run jubarte-wasm/cli/bin/jubarte-redlines.mjs against the checked-in
      # jubarte-wasm build.
      - name: Regenerate and compare
        run: scripts/gen_docs.sh --check

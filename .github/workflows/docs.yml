name: Docs

# The generated blocks in docs/rust.md, docs/python.md and docs/javascript.md
# (CLI references from real --help output, API references from the shipped
# module/declaration files), README.md's command table, and the per-library
# READMEs scripts/library_readmes.py cuts from README.md, and the flag and id
# catalogues (docs/flags_datetime.md, docs/locations.md) must never drift
# from the code. This job
# regenerates them and fails when the committed pages differ.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - src/**
      - jubarte-python/**
      - jubarte-wasm/**
      - docs/rust.md
      - docs/python.md
      - docs/javascript.md
      - README.md
      - README.crates.md
      - "**/README.fragment.md"
      - scripts/library_readmes.py
      - scripts/gen_docs.sh
      - scripts/gen_cli_docs.py
      - scripts/gen_python_api.py
      - scripts/gen_wasm_api.py
      - scripts/cli_flags.sh
      - scripts/cli_locations.py
      - scripts/cli_id_sources.py
      - examples/cli_flags.rs
      - Cargo.toml
      - Cargo.lock
      - docs/flags_datetime.md
      - docs/locations.md
      - tests/fixtures/**
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - src/**
      - jubarte-python/**
      - jubarte-wasm/**
      - docs/rust.md
      - docs/python.md
      - docs/javascript.md
      - README.md
      - README.crates.md
      - "**/README.fragment.md"
      - scripts/library_readmes.py
      - scripts/gen_docs.sh
      - scripts/gen_cli_docs.py
      - scripts/gen_python_api.py
      - scripts/gen_wasm_api.py
      - scripts/cli_flags.sh
      - scripts/cli_locations.py
      - scripts/cli_id_sources.py
      - examples/cli_flags.rs
      - Cargo.toml
      - Cargo.lock
      - docs/flags_datetime.md
      - docs/locations.md
      - tests/fixtures/**

# One run per PR (or branch): a new push cancels the PR's older run, and
# on main a newer commit replaces any run still waiting. The self-hosted
# runners are few, so superseded runs must not hold the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift:
    name: generated docs drift
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
      - uses: ./.github/actions/mbx
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The generator runs jubarte-wasm/cli/bin/jubarte-redlines.mjs against
      # the checked-in jubarte-wasm build. That CLI is ESM and engines-declares
      # node >= 18.3 (jubarte-wasm/cli/package.json); the self-hosted runner's
      # system node predates ESM (`import` is a SyntaxError), so a real node is
      # set up here instead of trusting the image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Regenerate and compare
        run: scripts/gen_docs.sh --check

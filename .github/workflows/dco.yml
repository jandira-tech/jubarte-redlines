name: DCO

# CONTRIBUTING.md asks every commit to be signed off (`git commit -s`), by
# which its author states the Developer Certificate of Origin. This checks
# the commits of a pull request to main. It reads the pull request's
# commits and runs nothing from them but scripts/check_dco.py, with a
# read-only token.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signed-off:
    name: commits are signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"

# 🐇🥕 Jules, el conejo: multi-stage PR review. It runs the static analysis this
# repository already trusts (cargo clippy, cargo deny, ruff, shellcheck), posts
# one report comment on the PR, and asks Jules to open a companion PR that fixes
# what it found. Adapted from arthrod/jules-el-conejo examples/pr-reviewer.yml;
# the review skills live in skills/jules-el-conejo/.
name: Jules, el conejo PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  # 🥕 Force a review of any open PR: gh workflow run jules-el-conejo-review.yml -f pr_number=123
  workflow_dispatch:
    inputs:
      pr_number:
        description: '🐇 Pull request number to review and remediate'
        required: true
        type: string

# No default token permissions; the job asks only for what it uses.
permissions: {}

concurrency:
  group: jules-el-conejo-review-${{ github.event.pull_request.number || inputs.pr_number }}
  # 🐇 Queue instead of cancel: a cancelled run still spends the Jules session it started.
  cancel-in-progress: false

jobs:
  review:
    name: Static analysis, review report & companion fix PR
    # 🥕 Fork and Dependabot PRs get no secrets; drafts and WIP titles wait. 🐇
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'WIP') &&
        !contains(github.event.pull_request.title, 'DO NOT MERGE')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      # 🥕 Only these logins may start a Jules session (PR author, or whoever dispatches).
      TRUSTED_USERS: '["arthrod"]'
      # 🐇 Adding this label to a PR asks for a new companion fix PR after later pushes.
      FIX_LABEL: jules-conejo

    steps:
      # 🐇 Stage 0: resolve the PR, also for workflow_dispatch, where the event has none.
      - name: 🐇 Resolve the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.PR_NUMBER || '')) {
              core.setFailed(`pr_number must be a number, got: ${process.env.PR_NUMBER}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('🐇 Fork PRs are not reviewed: they get no secrets.');
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title);
            core.setOutput('author', pr.user.login);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('body', pr.body || '');

      # 🥕 Check out the PR head with full history so git diff against the base works.
      - name: 🥕 Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # 🐇 The skills come from the workflow's own commit (main, or the PR merge
      # ref), not from the PR head: older PR branches do not have them.
      - name: 🐇 Check out the review skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .jules-el-conejo-skills
          sparse-checkout: skills/jules-el-conejo
          persist-credentials: false

      # 🐇 Stage 1: list the changed files and load the review skills.
      - name: 🐇 Detect changed files and load review skills
        id: skills
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD")"
          {
            echo "changed_files<<__JULES_EOF__"
            echo "${CHANGED_FILES}"
            echo "__JULES_EOF__"
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '\.rs$|Cargo\.(toml|lock)$'; then
              echo "rust_changed=true"
            else
              echo "rust_changed=false"
            fi
          } >> "$GITHUB_OUTPUT"

          load_skill() {
            local key="$1" file=".jules-el-conejo-skills/skills/jules-el-conejo/$2"
            {
              echo "${key}<<__JULES_SKILL_EOF__"
              cat "$file"
              # The delimiter must start its own line even if the file lacks a final newline.
              echo
              echo "__JULES_SKILL_EOF__"
            } >> "$GITHUB_OUTPUT"
          }
          load_skill triage_skill pr-review-static-triage.md
          load_skill security_skill pr-review-security-owasp.md
          load_skill perf_skill pr-review-performance.md
          load_skill arch_skill pr-review-architecture-quality.md
          load_skill testing_skill pr-review-testing.md
          load_skill polyglot_skill pr-review-polyglot-standards.md
          load_skill rust_skill pr-review-rust-quality.md
          load_skill visualizer_skill pr-body-visualizer.md

      # 🥕 Toolchain for the Rust gates, pinned like ci.yml. GitHub-hosted runners
      # cannot reach the mbx cache, so this leg uses rust-cache as ci.yml does.
      - name: 🥕 Install the Rust toolchain
        if: steps.skills.outputs.rust_changed == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
        with:
          components: clippy
      - name: 🐇 Cache cargo builds
        if: steps.skills.outputs.rust_changed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: 🥕 Install cargo-deny
        if: steps.skills.outputs.rust_changed == 'true'
        uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov tag, pinned 2026-10-01
        with:
          tool: cargo-deny
      # 🥕 Pinned: ruff.toml sets preview = true, and each ruff release adds
      # preview rules (0.17 added RUF105/RUF201). Bump together with ruff.toml.
      - name: 🐇 Install ruff
        run: pipx install ruff==0.17.2

      # 🥕 Stage 2: the repository's own gates, with the same flags as ci.yml.
      - name: 🥕 Run static analysis
        id: static_analysis
        env:
          RUST_CHANGED: ${{ steps.skills.outputs.rust_changed }}
          CHANGED_FILES: ${{ steps.skills.outputs.changed_files }}
        run: |
          REPORT_FILE="$(mktemp)"
          STATUS="passed"

          run_tool() {
            local label="$1" out
            shift
            echo "### 🛠️ ${label}" >> "$REPORT_FILE"
            if out="$("$@" 2>&1)"; then
              echo "- **Status:** ✅ Passed" >> "$REPORT_FILE"
            else
              STATUS="failed"
              {
                echo "- **Status:** ❌ Findings detected"
                echo '```text'
                printf '%s\n' "$out" | tail -n 80
                echo '```'
              } >> "$REPORT_FILE"
            fi
            echo "" >> "$REPORT_FILE"
          }

          if [ "$RUST_CHANGED" = true ]; then
            run_tool "cargo clippy (all targets, all features)" cargo clippy --all-targets --all-features -- -D warnings
            run_tool "cargo deny (advisories, bans, licenses, sources)" cargo deny check
          else
            {
              echo "### 🛠️ Rust gates"
              echo "- ⏭️ Skipped: no .rs or Cargo files changed."
              echo ""
            } >> "$REPORT_FILE"
          fi

          # 🐇 ruff and shellcheck read only the files this PR changes: a
          # repository-wide run reported the same old findings on every PR.
          # clippy and cargo deny stay crate-wide (a crate is their unit).
          mapfile -t PY_FILES < <(printf '%s\n' "$CHANGED_FILES" | grep -E '\.pyi?$' || true)
          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            run_tool "ruff (${#PY_FILES[@]} changed Python files, repository config)" \
              ruff check --force-exclude --output-format=concise -- "${PY_FILES[@]}"
          fi

          mapfile -t SHELL_FILES < <(printf '%s\n' "$CHANGED_FILES" | grep -E '\.(sh|bash)$' || true)
          if [ "${#SHELL_FILES[@]}" -gt 0 ]; then
            run_tool "shellcheck (${#SHELL_FILES[@]} changed shell scripts)" shellcheck --format=gcc "${SHELL_FILES[@]}"
          fi

          if [ "$RUST_CHANGED" != true ] && [ "${#PY_FILES[@]}" -eq 0 ] && [ "${#SHELL_FILES[@]}" -eq 0 ]; then
            echo "- ⏭️ No Rust, Python or shell file changed." >> "$REPORT_FILE"
          fi

          {
            echo "status=${STATUS}"
            echo "report<<__JULES_STATIC_EOF__"
            cat "$REPORT_FILE"
            echo "__JULES_STATIC_EOF__"
          } >> "$GITHUB_OUTPUT"
          rm -f "$REPORT_FILE"

      # 🐇 Stage 3: one report comment on the PR, including the PR body audit.
      - name: 🐇 Post the review report on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          STATIC_STATUS: ${{ steps.static_analysis.outputs.status }}
          STATIC_REPORT: ${{ steps.static_analysis.outputs.report }}
          CHANGED_FILES: ${{ steps.skills.outputs.changed_files }}
        with:
          script: |
            const body = process.env.PR_BODY || '';
            const has = (heading) => new RegExp(`^## ${heading}`, 'm').test(body);
            const staticStatus = process.env.STATIC_STATUS === 'passed' ? '✅ Passed' : '❌ Action Required';
            const files = (process.env.CHANGED_FILES || '').split('\n').filter(Boolean);
            const listed = files.slice(0, 25).map((f) => `- \`${f}\``).join('\n') || '- *(no changed files)*';
            const more = files.length > 25 ? `\n- …and ${files.length - 25} more` : '';
            // 🐇 One report per PR, edited in place on each push, not a new comment per push.
            const MARKER = '<!-- jules-el-conejo-report -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const report = [
                MARKER,
                '## 🐇🥕 Jules, el conejo — PR review report',
                `_Head: \`${process.env.HEAD_SHA.slice(0, 8)}\`_`,
                '',
                `| Stage | Status |`,
                '| :--- | :--- |',
                `| **Static analysis** (clippy, cargo deny, ruff, shellcheck) | ${staticStatus} |`,
                `| **PR body** (\`skills/jules-el-conejo/pr-body-visualizer.md\`) | ${has('Summary') && has('Evidence') && has('Merge Danger') ? '✅ Compliant' : '⚠️ Missing sections'} |`,
                '',
                `### 📂 Reviewed files (${files.length})`,
                listed + more,
                '',
                '### 🛠️ Static analysis',
                process.env.STATIC_REPORT || 'No findings.',
                '',
                '### 🖼️ PR description contract',
                `- ${has('Summary') ? '✅' : '⚠️'} \`## Summary\``,
                `- ${has('Evidence') ? '✅' : '⚠️'} \`## Evidence\` (Before/After)`,
                `- ${has('Merge Danger') ? '✅' : '⚠️'} \`## Merge Danger\` (Door & Blast Radius)`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.type === 'Bot' && (c.body || '').startsWith(MARKER),
            );
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: report,
              });
            }

      # 🥕 Stage 4: Jules opens a companion fix PR. Only for a trusted author or
      # dispatcher, and only when a PR opens, reopens, leaves draft, gets the
      # jules-conejo label, or is dispatched; a plain push does not start one.
      - name: 🐇 Run Jules, el conejo, for a companion fix PR
        id: jules
        if: >-
          (github.event_name == 'workflow_dispatch' && contains(fromJSON(env.TRUSTED_USERS), github.actor)) ||
          (
            github.event_name == 'pull_request' &&
            contains(fromJSON(env.TRUSTED_USERS), github.event.pull_request.user.login) &&
            (
              contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) ||
              (github.event.action == 'labeled' && github.event.label.name == env.FIX_LABEL)
            )
          )
        # 🥕 Pinned to arthrod/jules-el-conejo main after the hardened stack merged (2026-10-20).
        uses: arthrod/jules-el-conejo@4c78bd18b3d5352824eb0f195a2af951d7b4a314 # main 2026-10-20
        with:
          prompt: |
            You are a principal reviewer and remediation agent for jandira-tech/jubarte-redlines,
            a Rust DOCX redline engine with Python, wasm and Node bindings, scored against
            Microsoft Word. Review pull request #${{ steps.pr.outputs.number }}
            ("${{ steps.pr.outputs.title }}", branch ${{ steps.pr.outputs.head_ref }}).

            Follow AGENTS.md and CONTRIBUTING.md in the repository; they override generic advice below.

            Word parity comes first. Never make jubarte refuse, strip or rewrite an input that
            Microsoft Word opens: that is a regression, not hardening. A ZIP part name is an OPC
            URI that jubarte reads in memory and never writes to the file system, so file-system
            rules (Windows reserved names such as CON or AUX, path length) do not apply to it.
            A finding that claims Word behaviour must say how it was established.

            ## Changed files
            ${{ steps.skills.outputs.changed_files }}

            ## Static analysis results (same flags as ci.yml)
            ${{ steps.static_analysis.outputs.report }}

            ## Your mission
            1. Fix every finding reported above.
            2. Review the full base...head diff for correctness, Word fidelity regressions,
               security, performance and architecture, using the skills below.
            3. Add regression tests for every fix (cargo nextest, existing fixtures).
            4. Open ONE companion PR against `${{ steps.pr.outputs.head_ref }}`. Its body follows
               the PR body skill (## Summary, ## Evidence Before/After, ## Merge Danger) and lists
               each finding with file:line and the fix. If nothing needs fixing, open no PR.

            ## Skill: static triage
            ${{ steps.skills.outputs.triage_skill }}

            ## Skill: security (OWASP)
            ${{ steps.skills.outputs.security_skill }}

            ## Skill: performance
            ${{ steps.skills.outputs.perf_skill }}

            ## Skill: architecture & quality
            ${{ steps.skills.outputs.arch_skill }}

            ## Skill: testing
            ${{ steps.skills.outputs.testing_skill }}

            ## Skill: polyglot standards
            ${{ steps.skills.outputs.polyglot_skill }}

            ## Skill: Rust quality
            ${{ steps.skills.outputs.rust_skill }}

            ## Skill: PR body
            ${{ steps.skills.outputs.visualizer_skill }}
          title: "🐇 Jules, el conejo: review fixes for #${{ steps.pr.outputs.number }}"
          require_plan_approval: false
          automation_mode: AUTO_CREATE_PR
          starting_branch: ${{ steps.pr.outputs.head_ref }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      # 🥕 Link the Jules session on the PR.
      - name: 🥕 Post the Jules session link on the PR
        if: steps.jules.outputs.session_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SESSION_ID: ${{ steps.jules.outputs.session_id }}
          SESSION_URL: ${{ steps.jules.outputs.session_url }}
        with:
          script: |
            const session = process.env.SESSION_URL || `\`${process.env.SESSION_ID}\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `🐇🥕 Jules, el conejo, started a companion fix session for this PR: ${session}`,
            });

# Jules on every pull request, two jobs:
#
# - `review` — the line-by-line LLM review (audited fork of
#   thalesraymond/jules-pr-reviewer, pinned by commit; audit and rollout:
#   https://github.com/arthrod/jules-pr-reviewer/issues/1). It reads
#   .github/jules-review-rules.md: correctness and Word fidelity, security,
#   performance and improvements, best practices and tests, syntax and style.
# - `conejo` — 🐇🥕 Jules, el conejo: lint, syntax, security and workflow
#   checks over the changed files, one report comment kept current, and a
#   companion fix PR from Jules. Adapted from arthrod/jules-el-conejo
#   examples/pr-reviewer.yml; its skills live in skills/jules-el-conejo/.
name: Jules review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  # 🥕 Force el conejo on any open PR: gh workflow run jules.yml -f pr_number=123
  workflow_dispatch:
    inputs:
      pr_number:
        description: '🐇 Pull request number to review and remediate'
        required: true
        type: string

# No default token permissions; each job asks only for what it uses.
permissions: {}

jobs:
  review:
    # Fork and Dependabot PRs get no repository secrets, so there is no key to run with.
    # A label is not new code: the line review runs on code events only.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    # GitHub-hosted by default. To use a self-hosted runner (e.g. Coolify), set a repo
    # variable: gh variable set JULES_RUNNER -R <owner/repo> -b self-hosted
    # The runner must be recent enough to run node24 actions.
    runs-on: ${{ vars.JULES_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: jules-review-${{ github.event.pull_request.number }}
      # Queue instead of cancel: a cancelled run still spends the Jules session it started.
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      # No checkout: the action reads the diff and rules through the GitHub API,
      # so no token is persisted to disk in the workspace.
      - name: Jules review
        uses: arthrod/jules-pr-reviewer@8972cac9a5a8d3f389abbfb4b13f0b4a2c0dc650
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Jules checks out the PR branch itself and reviews the full base...head diff with repo context.
          diff_mode: agentic
          strictness: assertive
          min_severity_to_report: info
          enable_suggestions: "true"
          dedupe: "true"
          skip_drafts: "false"
          timeout_minutes: "45"
          fail_on: never
          # An LLM verdict must never count as a human approval.
          enable_approve: "false"
          # Correctness, security, performance, best practices and syntax,
          # with this repository's own rules (Word parity first).
          rules_file: .github/jules-review-rules.md
          extra_instructions: |
            Be exhaustive. Check every changed hunk for: correctness and edge cases; security
            (secrets in code or logs, injection, authz, unsafe deserialization, SSRF, path traversal);
            error handling and resource cleanup; concurrency and async misuse; performance regressions;
            missing or weakened tests for changed behaviour; breaking API or schema changes; docs that
            no longer match the code. Prefer concrete file:line findings with a fix over general advice.
            This is a DOCX engine whose first target is Microsoft Word parity (AGENTS.md): never ask
            jubarte to refuse, strip or rewrite an input that Word opens. ZIP part names are OPC URIs
            read in memory and never written to disk, so file-system rules (Windows reserved names,
            path length) do not apply to them. Do not report findings in code the PR does not change.
          ignored_paths: >-
            ["**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/bun.lock",
            "**/bun.lockb", "**/uv.lock", "**/poetry.lock", "**/Cargo.lock", "**/*.min.js",
            "**/*.map", "dist/**", "build/**", ".next/**", "node_modules/**"]

  conejo:
    name: Static analysis, review report & companion fix PR
    # 🥕 Fork and Dependabot PRs get no secrets; drafts and WIP titles wait. 🐇
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'WIP') &&
        !contains(github.event.pull_request.title, 'DO NOT MERGE')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: jules-el-conejo-${{ github.event.pull_request.number || inputs.pr_number }}
      # 🐇 Queue instead of cancel: a cancelled run still spends the Jules session it started.
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      # 🥕 Only these logins may start a Jules session (PR author, or whoever dispatches).
      TRUSTED_USERS: '["arthrod"]'
      # 🐇 Adding this label to a PR asks for a new companion fix PR after later pushes.
      FIX_LABEL: jules-conejo

    steps:
      # 🐇 Stage 0: resolve the PR, also for workflow_dispatch, where the event has none.
      - name: 🐇 Resolve the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.PR_NUMBER || '')) {
              core.setFailed(`pr_number must be a number, got: ${process.env.PR_NUMBER}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('🐇 Fork PRs are not reviewed: they get no secrets.');
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title);
            core.setOutput('author', pr.user.login);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('body', pr.body || '');

      # 🥕 Check out the PR head with full history so git diff against the base works.
      - name: 🥕 Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # 🐇 The skills come from the workflow's own commit (main, or the PR merge
      # ref), not from the PR head: older PR branches do not have them.
      - name: 🐇 Check out the review skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .jules-el-conejo-skills
          sparse-checkout: skills/jules-el-conejo
          persist-credentials: false

      # 🐇 Stage 1: list the changed files and load the review skills.
      - name: 🐇 Detect changed files and load review skills
        id: skills
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD")"
          {
            echo "changed_files<<__JULES_EOF__"
            echo "${CHANGED_FILES}"
            echo "__JULES_EOF__"
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '\.rs$|Cargo\.(toml|lock)$'; then
              echo "rust_changed=true"
            else
              echo "rust_changed=false"
            fi
          } >> "$GITHUB_OUTPUT"

          load_skill() {
            local key="$1" file=".jules-el-conejo-skills/skills/jules-el-conejo/$2"
            {
              echo "${key}<<__JULES_SKILL_EOF__"
              cat "$file"
              # The delimiter must start its own line even if the file lacks a final newline.
              echo
              echo "__JULES_SKILL_EOF__"
            } >> "$GITHUB_OUTPUT"
          }
          load_skill triage_skill pr-review-static-triage.md
          load_skill security_skill pr-review-security-owasp.md
          load_skill perf_skill pr-review-performance.md
          load_skill arch_skill pr-review-architecture-quality.md
          load_skill testing_skill pr-review-testing.md
          load_skill polyglot_skill pr-review-polyglot-standards.md
          load_skill rust_skill pr-review-rust-quality.md
          load_skill visualizer_skill pr-body-visualizer.md

      # 🥕 Toolchain for the Rust gates, pinned like ci.yml. GitHub-hosted runners
      # cannot reach the mbx cache, so this leg uses rust-cache as ci.yml does.
      - name: 🥕 Install the Rust toolchain
        if: steps.skills.outputs.rust_changed == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, pinned 2026-10-01
        with:
          components: clippy
      - name: 🐇 Cache cargo builds
        if: steps.skills.outputs.rust_changed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: 🥕 Install cargo-deny
        if: steps.skills.outputs.rust_changed == 'true'
        uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov tag, pinned 2026-10-01
        with:
          tool: cargo-deny
      - name: 🐇 Install the linters
        # 🥕 Pinned. ruff.toml sets preview = true and each ruff release adds
        # preview rules (0.17 added RUF105/RUF201): bump it with ruff.toml.
        run: |
          pipx install ruff==0.17.2
          pipx install zizmor==1.31.1
          pipx install actionlint-py==1.7.12.25

      # 🥕 Stage 2: five checks over what the PR changes, each with its own
      # status. ruff, shellcheck, the parsers and the workflow tools read only
      # the changed files: a repository-wide run reported the same old
      # findings on every PR. clippy, cargo fmt and cargo deny stay crate-wide
      # (a crate is their unit). Flags match ci.yml.
      - name: 🥕 Run static analysis, syntax, security and workflow checks
        id: static_analysis
        env:
          RUST_CHANGED: ${{ steps.skills.outputs.rust_changed }}
          CHANGED_FILES: ${{ steps.skills.outputs.changed_files }}
        run: |
          REPORT_FILE="$(mktemp)"
          declare -A STATUS=([lint]=skipped [syntax]=skipped [security]=skipped [workflows]=skipped)

          # run_tool AREA LABEL CMD...: one report section; a failure marks AREA.
          run_tool() {
            local area="$1" label="$2" out
            shift 2
            [ "${STATUS[$area]}" = skipped ] && STATUS[$area]=passed
            echo "#### 🛠️ ${label}" >> "$REPORT_FILE"
            if out="$("$@" 2>&1)"; then
              echo "- **Status:** ✅ Passed" >> "$REPORT_FILE"
            else
              STATUS[$area]=failed
              {
                echo "- **Status:** ❌ Findings detected"
                echo '```text'
                printf '%s\n' "$out" | tail -n 80
                echo '```'
              } >> "$REPORT_FILE"
            fi
            echo "" >> "$REPORT_FILE"
          }
          changed() { printf '%s\n' "$CHANGED_FILES" | grep -E "$1" || true; }

          mapfile -t PY_FILES < <(changed '\.pyi?$')
          mapfile -t SHELL_FILES < <(changed '\.(sh|bash)$')
          mapfile -t WORKFLOWS < <(changed '^\.github/workflows/.*\.ya?ml$')
          mapfile -t TOML_FILES < <(changed '\.toml$')
          mapfile -t JSON_FILES < <(changed '\.json$')
          mapfile -t YAML_FILES < <(changed '\.ya?ml$')

          echo "### 🧹 Lint" >> "$REPORT_FILE"
          if [ "$RUST_CHANGED" = true ]; then
            run_tool lint "cargo clippy (all targets, all features)" cargo clippy --all-targets --all-features -- -D warnings
          fi
          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            run_tool lint "ruff (${#PY_FILES[@]} changed Python files, repository config)" \
              ruff check --force-exclude --output-format=concise -- "${PY_FILES[@]}"
          fi
          if [ "${#SHELL_FILES[@]}" -gt 0 ]; then
            run_tool lint "shellcheck (${#SHELL_FILES[@]} changed shell scripts)" shellcheck --format=gcc "${SHELL_FILES[@]}"
          fi

          echo "### 🔤 Syntax and format" >> "$REPORT_FILE"
          if [ "$RUST_CHANGED" = true ]; then
            run_tool syntax "cargo fmt --check" cargo fmt --check
          fi
          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            # The repository's Python floor is 3.12 (ubuntu-latest's python3).
            run_tool syntax "Python 3.12 compiles (${#PY_FILES[@]} files)" python3 -m py_compile "${PY_FILES[@]}"
          fi
          if [ "${#SHELL_FILES[@]}" -gt 0 ]; then
            # shellcheck disable=SC2016 # "$f" expands in the inner bash, not here
            run_tool syntax "bash -n (${#SHELL_FILES[@]} files)" bash -c 'for f; do bash -n "$f" || exit 1; done' _ "${SHELL_FILES[@]}"
          fi
          if [ "${#TOML_FILES[@]}" -gt 0 ]; then
            run_tool syntax "TOML parses (${#TOML_FILES[@]} files)" \
              python3 -c 'import sys, tomllib; [tomllib.load(open(f, "rb")) for f in sys.argv[1:]]' "${TOML_FILES[@]}"
          fi
          if [ "${#JSON_FILES[@]}" -gt 0 ]; then
            run_tool syntax "JSON parses (${#JSON_FILES[@]} files)" \
              python3 -c 'import json, sys; [json.load(open(f, encoding="utf-8")) for f in sys.argv[1:]]' "${JSON_FILES[@]}"
          fi
          if [ "${#YAML_FILES[@]}" -gt 0 ]; then
            run_tool syntax "YAML parses (${#YAML_FILES[@]} files)" \
              ruby -ryaml -e 'ARGV.each { |f| YAML.safe_load(File.read(f), aliases: true) }' "${YAML_FILES[@]}"
          fi

          echo "### 🔒 Security" >> "$REPORT_FILE"
          if [ "$RUST_CHANGED" = true ]; then
            run_tool security "cargo deny (advisories, bans, licenses, sources)" cargo deny check
          fi
          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            # flake8-bandit's rules, on top of the repository's selection.
            run_tool security "ruff bandit rules (S) on ${#PY_FILES[@]} changed Python files" \
              ruff check --force-exclude --output-format=concise --select S --ignore S101,S404,S603,S607 -- "${PY_FILES[@]}"
          fi
          if [ "${#WORKFLOWS[@]}" -gt 0 ]; then
            run_tool security "zizmor (${#WORKFLOWS[@]} changed workflows, medium and up)" \
              zizmor --offline --format plain --min-severity medium "${WORKFLOWS[@]}"
          fi

          echo "### ⚙️ Workflows" >> "$REPORT_FILE"
          if [ "${#WORKFLOWS[@]}" -gt 0 ]; then
            run_tool workflows "actionlint (${#WORKFLOWS[@]} changed workflows)" actionlint "${WORKFLOWS[@]}"
          fi

          for area in lint syntax security workflows; do
            if [ "${STATUS[$area]}" = skipped ]; then
              echo "- ⏭️ ${area}: nothing in this PR for it to read." >> "$REPORT_FILE"
            fi
          done
          OVERALL=passed
          for area in lint syntax security workflows; do
            [ "${STATUS[$area]}" = failed ] && OVERALL=failed
          done
          {
            echo "status=${OVERALL}"
            for area in lint syntax security workflows; do echo "${area}=${STATUS[$area]}"; done
            echo "report<<__JULES_STATIC_EOF__"
            cat "$REPORT_FILE"
            echo "__JULES_STATIC_EOF__"
          } >> "$GITHUB_OUTPUT"
          rm -f "$REPORT_FILE"

      # 🐇 Stage 3: one report comment on the PR, including the PR body audit.
      - name: 🐇 Post the review report on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          LINT_STATUS: ${{ steps.static_analysis.outputs.lint }}
          SYNTAX_STATUS: ${{ steps.static_analysis.outputs.syntax }}
          SECURITY_STATUS: ${{ steps.static_analysis.outputs.security }}
          WORKFLOWS_STATUS: ${{ steps.static_analysis.outputs.workflows }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATIC_REPORT: ${{ steps.static_analysis.outputs.report }}
          CHANGED_FILES: ${{ steps.skills.outputs.changed_files }}
        with:
          script: |
            const body = process.env.PR_BODY || '';
            const has = (heading) => new RegExp(`^## ${heading}`, 'm').test(body);
            const mark = (s) => ({ passed: '✅ Passed', failed: '❌ Action required', skipped: '⏭️ Nothing to check' })[s] || '❔ Unknown';
            const files = (process.env.CHANGED_FILES || '').split('\n').filter(Boolean);
            const listed = files.slice(0, 25).map((f) => `- \`${f}\``).join('\n') || '- *(no changed files)*';
            const more = files.length > 25 ? `\n- …and ${files.length - 25} more` : '';
            // 🐇 One report per PR, edited in place on each push, not a new comment per push.
            const MARKER = '<!-- jules-el-conejo-report -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const report = [
                MARKER,
                '## 🐇🥕 Jules, el conejo — PR review report',
                `_Head: \`${process.env.HEAD_SHA.slice(0, 8)}\`_`,
                '',
                `| Stage | Status |`,
                '| :--- | :--- |',
                `| 🧹 **Lint** (clippy, ruff, shellcheck) | ${mark(process.env.LINT_STATUS)} |`,
                `| 🔤 **Syntax and format** (cargo fmt, Python 3.12, bash -n, TOML/JSON/YAML) | ${mark(process.env.SYNTAX_STATUS)} |`,
                `| 🔒 **Security** (cargo deny, ruff bandit rules, zizmor) | ${mark(process.env.SECURITY_STATUS)} |`,
                `| ⚙️ **Workflows** (actionlint) | ${mark(process.env.WORKFLOWS_STATUS)} |`,
                '| 🧠 **Review**: correctness, security, performance, improvements, best practices | The **Jules PR Review** check: inline comments on this PR, rules in `.github/jules-review-rules.md` |',
                `| **PR body** (\`skills/jules-el-conejo/pr-body-visualizer.md\`) | ${has('Summary') && has('Evidence') && has('Merge Danger') ? '✅ Compliant' : '⚠️ Missing sections'} |`,
                '',
                `### 📂 Reviewed files (${files.length})`,
                listed + more,
                '',
                process.env.STATIC_REPORT || 'No findings.',
                `_[Run log](${process.env.RUN_URL})_`,
                '',
                '### 🖼️ PR description contract',
                `- ${has('Summary') ? '✅' : '⚠️'} \`## Summary\``,
                `- ${has('Evidence') ? '✅' : '⚠️'} \`## Evidence\` (Before/After)`,
                `- ${has('Merge Danger') ? '✅' : '⚠️'} \`## Merge Danger\` (Door & Blast Radius)`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.type === 'Bot' && (c.body || '').startsWith(MARKER),
            );
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: report,
              });
            }

      # 🐇 Jules clones the PR branch with --depth 1, where `git diff base...head`
      # fails with "no merge base" (arthrod/jules-el-conejo#20, cell S11). This
      # checkout has the history, so the runner computes the diff and sends it.
      - name: 🐇 Fit the diff, file list and report into Jules's prompt
        id: diff
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          CHANGED_FILES: ${{ steps.skills.outputs.changed_files }}
          STATIC_REPORT: ${{ steps.static_analysis.outputs.report }}
        run: |
          # 🥕 The prompt reaches the action as one environment variable, which
          # Linux caps at 131,058 bytes of value. Every part that grows with the
          # PR is capped here and the prompt reads these copies: the file list
          # at 16,000 bytes, the report at 30,000, and the diff gets what is left
          # of 120,000 after them, the skills and 8,000 bytes of instructions.

          # fit FILE LIMIT: cut FILE to at most LIMIT bytes at a line boundary.
          # Prints true when it cut.
          fit() {
            local size
            size=$(wc -c < "$1")
            if [ "$size" -le "$2" ]; then echo false; return; fi
            if [ "$2" -gt 0 ]; then
              head -c "$2" "$1" | sed '$d' > "$1.cut"
            else
              : > "$1.cut"
            fi
            mv "$1.cut" "$1"
            echo true
          }
          # 🐇 Valid UTF-8 only: the runner decodes outputs as UTF-8 and turns each
          # invalid byte into a 3-byte U+FFFD, which would break the budget.
          # iconv -c drops those bytes. glibc's iconv still writes the output
          # but exits 1 when the input ends in a truncated sequence; any other
          # failure (127: no iconv) must stop the step, not send an empty diff.
          utf8() { iconv -c -f UTF-8 -t UTF-8 < "$1" > "$2" || [ $? -eq 1 ]; }

          raw="$(mktemp)"
          files="$(mktemp)"
          report="$(mktemp)"
          diff="$(mktemp)"
          printf '%s\n' "$CHANGED_FILES" > "$raw" && utf8 "$raw" "$files"
          printf '%s\n' "$STATIC_REPORT" > "$raw" && utf8 "$raw" "$report"
          git diff --no-color "origin/${BASE_REF}...HEAD" > "$raw"
          utf8 "$raw" "$diff"
          size=$(wc -c < "$diff")

          if [ "$(fit "$files" 16000)" = true ]; then
            echo "(list cut at 16,000 bytes: run git diff --name-only for the rest)" >> "$files"
          fi
          if [ "$(fit "$report" 30000)" = true ]; then
            echo "(report cut at 30,000 bytes: the run log has the rest)" >> "$report"
          fi
          used=$(( $(cat .jules-el-conejo-skills/skills/jules-el-conejo/*.md | wc -c) \
            + $(wc -c < "$files") + $(wc -c < "$report") + 8000 ))
          budget=$(( 120000 - used ))
          [ "$budget" -gt 0 ] || budget=0
          truncated=$(fit "$diff" "$budget")

          # 🥕 A random delimiter: these outputs carry PR content, and a line equal
          # to a fixed delimiter would end an output early and write others.
          delim="JULES_FIT_$(openssl rand -hex 16)"
          {
            echo "truncated=${truncated}"
            echo "size=${size// /}"
            for name in files report diff; do
              echo "${name}<<${delim}"
              cat "${!name}"
              echo
              echo "${delim}"
            done
          } >> "$GITHUB_OUTPUT"
          rm -f "$raw" "$files" "$report" "$diff"

      # 🥕 Stage 4: Jules opens a companion fix PR. Only for a trusted author or
      # dispatcher, and only when a PR opens, reopens, leaves draft, gets the
      # jules-conejo label, or is dispatched; a plain push does not start one.
      - name: 🐇 Run Jules, el conejo, for a companion fix PR
        id: jules
        if: >-
          (github.event_name == 'workflow_dispatch' && contains(fromJSON(env.TRUSTED_USERS), github.actor)) ||
          (
            github.event_name == 'pull_request' &&
            contains(fromJSON(env.TRUSTED_USERS), github.event.pull_request.user.login) &&
            (
              contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) ||
              (github.event.action == 'labeled' && github.event.label.name == env.FIX_LABEL)
            )
          )
        # 🥕 Pinned to the v1.1.0 release: it waits out the account's concurrency
        # cap (429 or 400 FAILED_PRECONDITION) at 5, 10, 15 and 30 minutes.
        uses: arthrod/jules-el-conejo@72c9075a45a522697e4cfa61f460cbd14e69ac91 # v1.1.0
        with:
          prompt: |
            You are a principal reviewer and remediation agent for jandira-tech/jubarte-redlines,
            a Rust DOCX redline engine with Python, wasm and Node bindings, scored against
            Microsoft Word. Review pull request #${{ steps.pr.outputs.number }}
            ("${{ steps.pr.outputs.title }}", branch ${{ steps.pr.outputs.head_ref }}).

            Follow AGENTS.md and CONTRIBUTING.md in the repository; they override generic advice below.

            Word parity comes first. Never make jubarte refuse, strip or rewrite an input that
            Microsoft Word opens: that is a regression, not hardening. A ZIP part name is an OPC
            URI that jubarte reads in memory and never writes to the file system, so file-system
            rules (Windows reserved names such as CON or AUX, path length) do not apply to it.
            A finding that claims Word behaviour must say how it was established.

            ## Changed files
            ${{ steps.diff.outputs.files }}

            ## Static analysis results (same flags as ci.yml)
            ${{ steps.diff.outputs.report }}

            ## The diff (base `${{ steps.pr.outputs.base_ref }}`...head `${{ steps.pr.outputs.head_sha }}`)
            Computed on the runner. Your checkout is a depth-1 clone, so a `git diff` against the
            base fails there with "no merge base" until you fetch more history:
            `git fetch --deepen=200 origin ${{ steps.pr.outputs.base_ref }} ${{ steps.pr.outputs.head_ref }}`,
            then `git diff origin/${{ steps.pr.outputs.base_ref }}...HEAD`.
            ${{ steps.diff.outputs.truncated == 'true' && format('This diff is cut at a line boundary; the whole diff is {0} bytes. Fetch as above and read the rest yourself.', steps.diff.outputs.size) || 'This diff is complete.' }}

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

            ## Your mission
            1. Fix every finding reported above.
            2. Review the diff above for correctness, Word fidelity regressions,
               security, performance and architecture, using the skills below.
            3. Add regression tests for every fix (cargo nextest, existing fixtures).
            4. Open ONE companion PR against `${{ steps.pr.outputs.head_ref }}`. Its body follows
               the PR body skill (## Summary, ## Evidence Before/After, ## Merge Danger) and lists
               each finding with file:line and the fix. If nothing needs fixing, open no PR.

            ## Skill: static triage
            ${{ steps.skills.outputs.triage_skill }}

            ## Skill: security (OWASP)
            ${{ steps.skills.outputs.security_skill }}

            ## Skill: performance
            ${{ steps.skills.outputs.perf_skill }}

            ## Skill: architecture & quality
            ${{ steps.skills.outputs.arch_skill }}

            ## Skill: testing
            ${{ steps.skills.outputs.testing_skill }}

            ## Skill: polyglot standards
            ${{ steps.skills.outputs.polyglot_skill }}

            ## Skill: Rust quality
            ${{ steps.skills.outputs.rust_skill }}

            ## Skill: PR body
            ${{ steps.skills.outputs.visualizer_skill }}
          title: "🐇 Jules, el conejo: review fixes for #${{ steps.pr.outputs.number }}"
          require_plan_approval: false
          automation_mode: AUTO_CREATE_PR
          starting_branch: ${{ steps.pr.outputs.head_ref }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      # 🥕 Link the Jules session on the PR.
      - name: 🥕 Post the Jules session link on the PR
        if: steps.jules.outputs.session_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SESSION_ID: ${{ steps.jules.outputs.session_id }}
          SESSION_URL: ${{ steps.jules.outputs.session_url }}
        with:
          script: |
            const session = process.env.SESSION_URL || `\`${process.env.SESSION_ID}\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `🐇🥕 Jules, el conejo, started a companion fix session for this PR: ${session}`,
            });

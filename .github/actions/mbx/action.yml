name: mbx remote cache
description: Run Cargo through mbx, backed by the self-hosted runners' cache server

# The self-hosted runners share one mbx cache server on their private Docker
# network (`mbx-cache`), so a crate one runner compiled is a cache hit on the
# others. The server takes no token: mbx sends none over plain HTTP, and only
# the runners can reach it. Pushes and pull requests from this repository's
# own branches publish; pull requests from forks only read (see the step
# below). GitHub-hosted runners cannot reach the server, so jobs that also run
# there keep Swatinem/rust-cache on those legs.
runs:
  using: composite
  steps:
    - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        backend: remote
        # 1.25.0 adds MBX_REMOTE_TRUST_WRITES, which the next step uses.
        version: "1.25.0"
        remote-url: http://mbx-cache:7543
        # No namespace input: mbx reads it from the runner's user config
        # (/root/.config/mbx/config.toml, from /srv/mbx/runner-config.toml on
        # the host), so every jandira-tech runner shares one namespace.
        # Linked test binaries are the largest outputs by far: with
        # them cached, one test job left an 84 GiB store and a 79 GiB target
        # on 2026-10-17, and uploads drained at 1 MB/s. Cache compilations only.
        cache-links: "false"
    # mbx publishes only from pushes to a protected branch unless writes are
    # trusted, so pull requests used to read without filling the cache. Trust
    # every build from this repository, but not pull requests from forks: the
    # repository is public, and a fork's build could otherwise put tampered
    # artifacts in the cache that release builds read.
    - name: let same-repository pull requests publish to the cache
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      run: echo "MBX_REMOTE_TRUST_WRITES=true" >> "$GITHUB_ENV"
    # Every job on a runner builds in the same checkout, so mbx always counts
    # that checkout's managed target as the most recently used and never
    # collects it: on 2026-10-17 three of them reached 69-220 GiB in a few
    # hours and filled the disk the four runners share. Each job now starts
    # from an empty target, restored from the store and the cache server,
    # and each runner's store keeps to a fixed share of the disk.
    - name: bound mbx's disk use
      shell: bash
      run: |
        echo "MBX_GC_MAX_TOTAL_SIZE=20GiB" >> "$GITHUB_ENV"
        mbx clean --under "$GITHUB_WORKSPACE"
        MBX_GC_MAX_TOTAL_SIZE=20GiB mbx gc
    # Each of the 482 files in tests/ links its own binary, and with the dev
    # profile's full debug info one job's target reached 38-72 GiB on
    # 2026-10-17. Line tables keep file:line in backtraces at a fraction of
    # the size and link time. Set here so every cached job shares the keys.
    - name: build with line tables only
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
    # The Cargo shim puts every `cargo` behind mbx, including the ones
    # scripts, maturin and cargo-llvm-cov start, so steps keep plain `cargo`.
    - name: route cargo through mbx
      shell: bash
      run: |
        mbx setup --yes
        echo "${XDG_DATA_HOME:-$HOME/.local/share}/mbx/bin" >> "$GITHUB_PATH"

[project]
name = "cli-v2-pilot"
version = "0.1.0"
description = "Held-out paired workflow pilot for the jubarte CLI v2"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7",
    "coverage>=7.10",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: real temporary filesystem, process or CLI boundary"]
addopts = "--cov=harness --cov=run --cov=grade --cov=report --cov=stub_agent --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
patch = ["subprocess"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

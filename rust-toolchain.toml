# The toolchain a plain `cargo` uses in this checkout. The minimum supported
# version is `rust-version` in Cargo.toml, which CI tests in its own job;
# jobs that need another toolchain set RUSTUP_TOOLCHAIN.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]

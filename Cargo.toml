# Standalone workspace (also shields the crate from any enclosing workspace
# while this checkout sits inside another repo).
[workspace]

[package]
name = "jubarte-redlines"
version = "0.14.0"
edition = "2024"
rust-version = "1.94"
authors = ["Jandira Technologies, LLC"]
license = "AGPL-3.0-only"
description = "Word-faithful DOCX redline engine — compare two Word documents into a tracked-changes document that opens cleanly in Microsoft Word; list, accept, or reject revisions"
repository = "https://github.com/jandira-tech/jubarte-redlines"
documentation = "https://docs.rs/jubarte-redlines"
readme = "README.crates.md"
keywords = ["docx", "redline", "track-changes", "word", "pdf"]
categories = ["text-processing", "parser-implementations", "command-line-utilities", "wasm"]
# Keep the published package lean: test fixtures/goldens (~3 MB) and dev tools
# stay in the repository only.
# Patterns are anchored ("/…"): cargo include globs use gitignore semantics,
# so an unanchored "README.md" would also drag in every README.md under
# jubarte-app/…/node_modules etc.
include = [
  "/src/**",
  "/schemas/**",
  "/assets/fonts/**",
  "/benches/**",
  "/Cargo.toml",
  "/README.md",
  "/README.crates.md",
  "/CHANGELOG.md",
  "/KNOWN_ISSUES.md",
  "/docs/TUNING_AUDIT.md",
  "/LICENSE",
  "/LICENSES.md",
  "/NOTICE",
  "/LICENSES/**",
  "/keys/*.pub",
]

# Rust import path stays `jubarte::…` (historical library name). The crates.io
# package / GitHub repo are `jubarte-redlines`.

[package.metadata.release-notes]
"0.9.2" = "DOCX to PDF closer to Microsoft Word: Word-probed layout rules, painted revision marks (PdfOptions::revisions), comment balloons, East Asian layout, smaller PDFs. compare_documents output unchanged."

"0.9.3" = "Redlines Word refused to open now open. A field whose code changed is replaced whole, and a same-code field stays whole, as in Word's redline. Table, list and section markup follow Word, and the same input writes the same bytes."
"0.10.0" = "Adds jubarte inspect, text, edit and capabilities with input-admission budgets, --mode word|powertools, convert --png and self-update; Word-mode redlines keep changed text boxes, per-section headers and footers, and comment anchors as Word does."
"0.10.1" = "Per-change accept/reject (Word's Accept / Reject This Change) in the library and edit plans; Word-parity fixes to Reject All; many docx-to-PDF layout fixes (page breaks, keep-with-next by compat mode, table row splits, floating tables, headers/footers, comment balloons); new debug checks (--check render, diff, -c text)."
"0.11.0" = "Edit plans gain rewrite, tables, lists, run formatting, footnotes, images, page setup, content controls, watermark, redact, settings and field updates; new audit, validate/repair, scrub, append, comments and diff-render modules; input admission with LEGACY_DOC refusal; conventional marks follow Litera Compare; closer-to-Word docx-to-PDF. Breaking: WmlDocument::document_byte_array is private, use bytes()."
"0.11.2" = "Word-mode compare decides word-level marks or a whole-paragraph replacement by Word's own kept-character rule; convert paints comments as Word's balloons and tracks Word's PDF layout more closely; release_info/ carries each release's benchmark evidence. On two 600-item samples scored against Word's own output: redlines mean 76.71 (Docxodus 69.24), PDFs mean 78.77 (LibreOffice 54.06), no failed item."
"0.11.3" = "convert reads Word 97-2003 .doc files and writes page markers into Markdown; OMML math is laid out as Word does; the font report no longer counts a guessed face as a match; MSRV 1.94. On two 600-item samples scored against Word's own output: redlines mean 72.06 (Docxodus 65.15), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.14 (LibreOffice 54.61), no failed document."
"0.12.0" = "Agent view (jubarte::markdown, read/edit/add flag plans), text diff views, PdfOptions::comments (CommentPlacement::End) and PdfOptions::changed_only (a struct literal naming every field now needs ..PdfOptions::default()), Word's Roman/letter field formats, a searchable PDF text layer for text no font covers (/ActualText), and redline fixes for files Word 16.115 hung on. rdocx-opc 0.2 fixes RUSTSEC-2026-0194. On two 600-item samples scored against Word's own output: redlines mean 71.89 (Docxodus 64.95), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.19 (LibreOffice 54.61), no failed document."
"0.13.0" = "replace keeps the words it keeps; one logical change per edit (composite ids); edit --skip-failed; visible rejects (strike, restore); Word math as LaTeX and Markdown round-trips for charts, fields and images; PDF math layout, columns and header PAGE fields; Strict OOXML read and compared as itself; malformed ZIP packages refused (GHSA-m665-v7pm-7grj); -d, --datetime replaces --date. On two 600-item samples scored against Word's own output: redlines mean 71.63 (Docxodus 64.92), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.19 (LibreOffice 54.61), no failed document."
"0.14.0" = "Breaking: `jubarte::cli::ReadArgs::paragraphs` is a `Vec<String>` and `Command::Changes` gains `author`. New Rust API: `cli::refused_package`, `update::verify_signature` with `ReleaseKey`, `comparer::order_tables`, more `namespaces` helpers. Tracked edits keep formatting history apart and refuse duplicate revision ids; table redlines avoid the final-mark revision that hangs Word. No `block-buffer` 0.10.4 in any build. Known: 3 of 600 sample redlines crash Word 16.115 where Word's own does not (#1802)."
[lib]
name = "jubarte"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

# The patch gate (scripts/release.sh, step 0) fails only on lints at deny;
# cargo-semver-checks ships these at allow (never run) or warn (only
# reported), so a patch could grow the public API (#1744).
# scripts/semver_lints.py checks this table against the installed tool.
[package.metadata.cargo-semver-checks.lints]
auto_trait_impl_added = "deny"
enum_must_use_removed = "deny"
enum_no_longer_non_exhaustive = "deny"
enum_non_exhaustive_struct_variant_field_added = "deny"
enum_non_exhaustive_tuple_variant_field_added = "deny"
enum_repr_int_added = "deny"
enum_variant_no_longer_non_exhaustive = "deny"
exhaustive_enum_added = "deny"
exhaustive_struct_added = "deny"
exhaustive_struct_with_doc_hidden_fields_added = "deny"
exhaustive_struct_with_private_fields_added = "deny"
feature_newly_enables_feature = "deny"
function_must_use_removed = "deny"
function_no_longer_unsafe = "deny"
function_now_const = "deny"
inherent_associated_pub_const_added = "deny"
inherent_method_added = "deny"
inherent_method_must_use_removed = "deny"
inherent_method_no_longer_unsafe = "deny"
inherent_method_now_const = "deny"
non_exhaustive_enum_added = "deny"
non_exhaustive_struct_added = "deny"
partial_ord_enum_struct_variant_fields_reordered = "deny"
partial_ord_enum_variants_reordered = "deny"
partial_ord_struct_fields_reordered = "deny"
pub_api_sealed_trait_became_unconditionally_sealed = "deny"
pub_api_sealed_trait_became_unsealed = "deny"
pub_api_sealed_trait_method_receiver_added = "deny"
pub_api_sealed_trait_method_receiver_mut_ref_became_ref = "deny"
pub_api_sealed_trait_method_return_value_added = "deny"
pub_api_sealed_trait_method_target_feature_removed = "deny"
pub_const_added = "deny"
pub_static_added = "deny"
repr_c_added = "deny"
repr_c_enum_struct_variant_fields_reordered = "deny"
repr_c_plain_struct_fields_reordered = "deny"
struct_must_use_removed = "deny"
struct_no_longer_has_non_pub_fields = "deny"
struct_no_longer_non_exhaustive = "deny"
trait_must_use_removed = "deny"
unconditionally_sealed_trait_became_pub_api_sealed = "deny"
unconditionally_sealed_trait_became_unsealed = "deny"
union_added = "deny"
union_field_added_with_non_pub_fields = "deny"
union_must_use_removed = "deny"

# Workspace lint policy (plan A1). Groups at priority = -1; pedantic is NOT
# enabled as a group — only individually chosen low-hit pedantic lints.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage, coverage_nightly)'] }
unsafe_code = "deny" # the library and CLI forbid it outright; the allocation-counting examples and tests need it

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Targeted pedantic (individually, NOT the group).
# Dropped: redundant_closure_for_method_calls (>50 hits → follow-up).
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"

[features]
default = ["cli", "fast-alloc", "self-update"]
# The `jubarte` binary's CLI (clap). Library consumers can opt out with
# `default-features = false` to keep the dependency tree minimal.
cli = ["dep:clap", "dep:same-file"]
# CLI global allocator (mimalloc). Default-on; disable with
# `--no-default-features --features cli` to fall back to the system allocator
# (used for allocator A/B measurement). Only the binary installs it, but a
# library dependency on the default features still compiles mimalloc; use
# `default-features = false` (as the in-repo python/wasm/app crates do).
fast-alloc = ["cli", "dep:mimalloc"]
# P0-LAB-01: compiled-out stage counters / coarse timers (src/perf.rs).
# Diagnostic only — never use a profiled build for final wall-time claims.
perf-profile = []
# `jubarte self-update`: installs a GitHub release on request (docs/SELF_UPDATE.md).
# Default-on for the binary; library consumers use `default-features = false`
# and get no network code.
self-update = ["cli", "dep:self_update", "dep:ed25519-dalek"]

[dependencies]
# Upstream OPC types on zip 9 and patched quick-xml 0.41. The adapter keeps
# its duplicate-repair and canonical-writing policy; optional crypto stays off.
oxml-opc = { version = "0.14.2", default-features = false } # OPC types; encryption/signatures stay disabled
zip = { version = "9.0.5", default-features = false, features = ["deflate"] } # deterministic package writer and direct ZIP access; pure-Rust Deflate; >= 9.0.5 closes GHSA-m665-v7pm-7grj (zip cloaking, SECURITY.md)
sha1 = "0.11"
ttf-parser = "0.25" # DOCX→PDF glyph metrics + TTF embed (Carlito / Liberation)
rustybuzz = "0.20" # HarfBuzz-compatible shaping so advances match soffice
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] } # Mark / Symbol general categories for word tokens (`util::word_tokens`); already in the tree through rustybuzz
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif"] } # raster images in the PDF writer
flate2 = "1.1" # optional `/FlateDecode` on PDF streams (already in the tree via zip/png, but a transitive dep is not usable directly)
quick-xml = "0.42" # checked XML admission (`xmllinq::parse::validate_xml`) before the permissive DOM parser
# `OpcError::Xml`/`XmlAttr` (oxml-opc 0.14.2) carry quick-xml 0.41's error types,
# and 0.42's (`QName` now wraps `&str`, new error paths) do not convert to them.
# The OPC record scanner reads with the same 0.41 the payload uses, so a syntax
# error surfaces as `OpcError::Xml` instead of an I/O refusal (#524, #1069).
quick-xml-041 = { package = "quick-xml", version = "0.41", default-features = false }
sha2 = "0.11" # SHA-256 snapshot guard shared by `inspect` and `edit`
schemars = "1.2.2" # Legacy edit discovery derives field facts from the Serde model.
serde = { version = "1", features = ["derive"] } # inspect snapshot / edit plan / report wire types
serde_json = "1"
base64 = "0.23" # `drawing:` payloads embed their dependent parts (already in the tree transitively)
regex = "1" # `read --for-edit --regex` search (already in the tree for tests)
tiny-skia = "0.12" # DOCX→PNG page raster over the layout display list
pulldown-cmark = { version = "0.13", default-features = false } # Markdown → DOCX (`jubarte::markdown`); CommonMark + GFM tables/footnotes
similar = { version = "3", default-features = false, features = ["text"] } # Markdown and Git/GitHub unified text diffs
foldhash = "0.2" # the XML name interner's hasher: well mixed low bits for short, similar names, unlike SipHash (slow) or FNV (clustered)
clap = { version = "4.5", features = ["derive", "string", "wrap_help"], optional = true }
# CLI file identity: a side file that names the input through a hard link,
# a symlink or another case is refused (Windows has no stable std API).
same-file = { version = "1", optional = true }
# CLI-only global allocator. The redline pipeline is ~41% allocation self-time
# (xmllinq node clone/drop churn, measured via samply on the RFP17 fixtures);
# mimalloc cuts that per-alloc cost with zero behaviour change. Kept out of the
# pure-library dependency tree so downstream consumers pick their own allocator.
mimalloc = { version = "0.1", default-features = false, optional = true }
# `jubarte self-update`: release lookup, SHA256SUMS.txt check, archive
# extraction and binary replacement. Only the command contacts the network.
self_update = { version = "1.3.1", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "checksums"], optional = true }
# The zipsign signature check (src/update/zipsign.rs, enforced once a release
# key is committed: docs/SELF_UPDATE.md): ed25519ph over SHA-512. Not
# `self_update`'s `signatures`, whose zipsign-api 0.2 pins ed25519-dalek 2 and
# with it block-buffer 0.10.4 (GHSA-qwgh-2vcv-g2f7, #1705).
ed25519-dalek = { version = "3", default-features = false, features = ["digest"], optional = true }

# Windows releases are .zip. Zip support stays off elsewhere: it turns on the
# zip crate's `time` feature, which stamps wall-clock times into our own
# archives unless every entry sets its time (986c526). The zip signature
# check needs no zip support: it hashes the bytes after the signatures.
[target.'cfg(windows)'.dependencies]
self_update = { version = "1.3.1", default-features = false, features = ["archive-zip", "compression-zip-deflate"], optional = true }

# Host filesystem publication is unavailable to browser/WASM byte APIs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "4"
uuid = { version = "1", features = ["v4"] }

# wasm32-unknown-unknown has no clock in std: `SystemTime::now` panics. The
# host's `Date` dates new comments and DATE/TIME fields there instead.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", default-features = false }

[[bin]]
name = "jubarte"
required-features = ["cli"]

# scripts/cli_flags.sh: every flag from clap's model, as Markdown.
[[example]]
name = "cli_flags"
required-features = ["cli"]

[dev-dependencies]
# Dev-only JSON Schema validator. `parse_expectations` (src/expect.rs)
# enforces the same constraints in plain Rust so the WASM and Python
# lockfiles do not pull this crate in at runtime. The tests load the
# bundled schema from disk and use this validator only to confirm
# parse_expectations and the bundled schema agree on accept/reject.
jsonschema = { version = "0.60", default-features = false }
criterion = "0.8"
# Round-trip validation of produced .docx files in integration tests; only the
# `parts` feature (= dep:zip) is built.
ooxmlsdk = { version = "0.13.2", default-features = false, features = ["parts"] }
# tests/agent_text_view.rs: the agent view's header must parse as YAML.
saphyr = "0.2"
tempfile = "3"

[[bench]]
name = "redline"
harness = false

# Use zip 9 for RUSTSEC-2026-0367, -0368 and -0369 (jandira-tech/ooxmlsdk#1),
# and zip >= 9.0.5 for GHSA-m665-v7pm-7grj (zip cloaking; recorded in
# SECURITY.md; admission refuses disagreeing headers, ZIP_HEADER_MISMATCH).
# Remove this patch when an ooxmlsdk release requires zip >= 9 (#1092).
[patch.crates-io]
ooxmlsdk = { git = "https://github.com/jandira-tech/ooxmlsdk", rev = "d7c3ae016da8ef661d9a04e12c47003d8fe51eff" }

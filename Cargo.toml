# Standalone workspace (also shields the crate from any enclosing workspace
# while this checkout sits inside another repo).
[workspace]

[package]
name = "jubarte-redlines"
version = "0.11.3"
edition = "2024"
rust-version = "1.94"
authors = ["Jandira Technologies, LLC"]
license = "AGPL-3.0-only"
description = "Word-faithful DOCX redline engine — compare two Word documents into a tracked-changes document that opens cleanly in Microsoft Word; list, accept, or reject revisions"
repository = "https://github.com/jandira-tech/jubarte-redlines"
homepage = "https://github.com/jandira-tech/jubarte-redlines"
documentation = "https://docs.rs/jubarte-redlines"
readme = "README.crates.md"
keywords = ["docx", "redline", "track-changes", "word", "pdf"]
categories = ["text-processing", "parser-implementations", "command-line-utilities", "wasm"]
# Keep the published package lean: test fixtures/goldens (~3 MB) and dev tools
# stay in the repository only.
# Patterns are anchored ("/…"): cargo include globs use gitignore semantics,
# so an unanchored "README.md" would also drag in every README.md under
# jubarte-app/…/node_modules etc.
include = [
  "/src/**",
  "/assets/fonts/**",
  "/benches/**",
  "/Cargo.toml",
  "/README.md",
  "/README.crates.md",
  "/CHANGELOG.md",
  "/KNOWN_ISSUES.md",
  "/docs/TUNING_AUDIT.md",
  "/LICENSE",
  "/LICENSES.md",
  "/NOTICE",
  "/LICENSES/**",
  "/keys/*.pub",
]

# Rust import path stays `jubarte::…` (historical library name). The crates.io
# package / GitHub repo are `jubarte-redlines`.

[package.metadata.release-notes]
"0.9.2" = "DOCX to PDF closer to Microsoft Word: Word-probed layout rules, painted revision marks (PdfOptions::revisions), comment balloons, East Asian layout, smaller PDFs. compare_documents output unchanged."

"0.9.3" = "Redlines Word refused to open now open. A field whose code changed is replaced whole, and a same-code field stays whole, as in Word's redline. Table, list and section markup follow Word, and the same input writes the same bytes."
"0.10.0" = "Adds jubarte inspect, text, edit and capabilities with input-admission budgets, --mode word|powertools, convert --png and self-update; Word-mode redlines keep changed text boxes, per-section headers and footers, and comment anchors as Word does."
"0.10.1" = "Per-change accept/reject (Word's Accept / Reject This Change) in the library and edit plans; Word-parity fixes to Reject All; many docx-to-PDF layout fixes (page breaks, keep-with-next by compat mode, table row splits, floating tables, headers/footers, comment balloons); new debug checks (--check render, diff, -c text)."
"0.11.0" = "Edit plans gain rewrite, tables, lists, run formatting, footnotes, images, page setup, content controls, watermark, redact, settings and field updates; new audit, validate/repair, scrub, append, comments and diff-render modules; input admission with LEGACY_DOC refusal; conventional marks follow Litera Compare; closer-to-Word docx-to-PDF. Breaking: WmlDocument::document_byte_array is private, use bytes()."
"0.11.2" = "Word-mode compare decides word-level marks or a whole-paragraph replacement by Word's own kept-character rule; convert paints comments as Word's balloons and tracks Word's PDF layout more closely; release_info/ carries each release's benchmark evidence. On two 600-item samples scored against Word's own output: redlines mean 76.71 (Docxodus 69.24), PDFs mean 78.77 (LibreOffice 54.06), no failed item."
"0.11.3" = "convert reads Word 97-2003 .doc files and writes page markers into Markdown; OMML math is laid out as Word does; the font report no longer counts a guessed face as a match; MSRV 1.94. On two 600-item samples scored against Word's own output: redlines mean 72.06 (Docxodus 65.15), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.14 (LibreOffice 54.61), no failed document."
[lib]
name = "jubarte"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

# Workspace lint policy (plan A1). Groups at priority = -1; pedantic is NOT
# enabled as a group — only individually chosen low-hit pedantic lints.
[lints.rust]
unsafe_code = "deny" # the library and CLI forbid it outright; the allocation-counting examples and tests need it

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Targeted pedantic (individually, NOT the group).
# Dropped: redundant_closure_for_method_calls (>50 hits → follow-up).
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"

[features]
default = ["cli", "fast-alloc", "self-update"]
# The `jubarte` binary's CLI (clap). Library consumers can opt out with
# `default-features = false` to keep the dependency tree minimal.
cli = ["dep:clap"]
# CLI global allocator (mimalloc). Default-on; disable with
# `--no-default-features --features cli` to fall back to the system allocator
# (used for allocator A/B measurement). Only the binary installs it, but a
# library dependency on the default features still compiles mimalloc; use
# `default-features = false` (as the in-repo python/wasm/app crates do).
fast-alloc = ["cli", "dep:mimalloc"]
# P0-LAB-01: compiled-out stage counters / coarse timers (src/perf.rs).
# Diagnostic only — never use a profiled build for final wall-time claims.
perf-profile = []
# `jubarte self-update`: installs a GitHub release on request (docs/SELF_UPDATE.md).
# Default-on for the binary; library consumers use `default-features = false`
# and get no network code.
self-update = ["cli", "dep:self_update"]

[dependencies]
rdocx-opc = "0.1" # OPC/zip package layer
zip = { version = "8.6.0", default-features = false, features = ["deflate"] } # fallback / direct zip access if rdocx-opc's surface is insufficient
sha1 = "0.11"
ttf-parser = "0.25" # DOCX→PDF glyph metrics + TTF embed (Carlito / Liberation)
rustybuzz = "0.20" # HarfBuzz-compatible shaping so advances match soffice
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] } # Mark / Symbol general categories for word tokens (`util::word_tokens`); already in the tree through rustybuzz
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif"] } # raster images in the PDF writer
flate2 = "1.1" # optional `/FlateDecode` on PDF streams (already in the tree via zip/png, but a transitive dep is not usable directly)
quick-xml = "0.42" # checked XML admission (`xmllinq::parse::validate_xml`) before the permissive DOM parser
sha2 = "0.11" # SHA-256 snapshot guard shared by `inspect` and `edit`
serde = { version = "1", features = ["derive"] } # inspect snapshot / edit plan / report wire types
serde_json = "1"
tiny-skia = "0.12" # DOCX→PNG page raster over the layout display list
pulldown-cmark = { version = "0.13", default-features = false } # Markdown → DOCX (`jubarte::markdown`); CommonMark + GFM tables/footnotes
similar = { version = "3", default-features = false, features = ["text"] } # Markdown and Git/GitHub unified text diffs
foldhash = "0.2" # the XML name interner's hasher: well mixed low bits for short, similar names, unlike SipHash (slow) or FNV (clustered)
clap = { version = "4.5", features = ["derive", "string", "wrap_help"], optional = true }
# CLI-only global allocator. The redline pipeline is ~41% allocation self-time
# (xmllinq node clone/drop churn, measured via samply on the RFP17 fixtures);
# mimalloc cuts that per-alloc cost with zero behaviour change. Kept out of the
# pure-library dependency tree so downstream consumers pick their own allocator.
mimalloc = { version = "0.1", default-features = false, optional = true }
# `jubarte self-update`: release lookup, SHA256SUMS.txt check, zipsign
# signature check (`signatures`, enforced once a release key is committed:
# docs/SELF_UPDATE.md), archive extraction and binary replacement. Only the
# command contacts the network.
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "checksums", "signatures"], optional = true }

# Windows releases are .zip. Zip support stays off elsewhere: it turns on the
# zip crate's `time` feature, which stamps wall-clock times into our own
# archives unless every entry sets its time (986c526). `archive-zip` also
# turns on zipsign's zip verifier when `signatures` is on (above).
[target.'cfg(windows)'.dependencies]
self_update = { version = "1.3", default-features = false, features = ["archive-zip", "compression-zip-deflate"], optional = true }

[[bin]]
name = "jubarte"
required-features = ["cli"]

[dev-dependencies]
criterion = "0.8"
# Round-trip validation of produced .docx files in integration tests; only the
# `parts` feature (= dep:zip) is built.
ooxmlsdk = { version = "0.13.1", default-features = false, features = ["parts"] }
tempfile = "3"
# tests/self_update_signature.rs: sign a throwaway .tar.gz exactly as
# `zipsign sign tar` does in release.yml, then check it with the updater's
# verifier. Test-only keys; nothing here signs a release.
zipsign-api = { version = "0.2", default-features = false, features = ["sign-tar"] }
tar = { version = "0.4", default-features = false }

[[bench]]
name = "redline"
harness = false

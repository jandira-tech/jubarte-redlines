# Standalone workspace for the WASM binding; the neurotic_docx_bench consumes
# it via a gitignored symlink. All bindings use the root OPC dependency.
[workspace]

[package]
name = "jubarte-wasm"
version = "0.18.0"
edition = "2024"
publish = false
description = "wasm-bindgen bindings for jubarte-redlines compare_documents (Word-mode redline)"
license = "Apache-2.0"
repository = "https://github.com/jandira-tech/jubarte"

[lib]
name = "jubarte_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
jubarte-dom = { path = "../crates/jubarte-dom", optional = true, default-features = false }
jubarte-opc = { path = "../crates/jubarte-opc", optional = true, default-features = false }
jubarte-redlines = { path = "../crates/jubarte-redlines", optional = true, default-features = false }
jubarte-render = { path = "../crates/jubarte-render", optional = true, default-features = false }
jubarte-doc = { path = "../crates/jubarte-doc", optional = true, default-features = false }
jubarte-markdown = { path = "../crates/jubarte-markdown", optional = true, default-features = false }
jubarte-edit = { path = "../crates/jubarte-edit", optional = true, default-features = false }
jubarte-cli = { path = "../crates/jubarte-cli", optional = true, default-features = false }
wasm-bindgen = "0.2"
serde = "1"
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["full", "console-panic"]
# Layered, each building on the one below (plan A4/T5.1):
compare = ["dep:jubarte-dom", "dep:jubarte-opc", "dep:jubarte-redlines"]
doc = ["compare", "dep:jubarte-doc"]
markdown = ["doc", "dep:jubarte-markdown"]
edit = ["markdown", "dep:jubarte-edit"]
cli = ["edit", "dep:jubarte-cli"]
# The renderer (docxToPdf / pdfPageCount / renderPdf / updateFields):
# references rustybuzz shaping, the image decoders, and the embedded
# Carlito/Liberation fonts (~7.5 MB of wasm). The npm *-slim builds
# turn this off for consumers that do not need PDF rendering.
pdf = [
    "dep:jubarte-render",
    "jubarte-doc?/render",
    "jubarte-markdown?/render",
    "jubarte-edit?/render",
    "jubarte-cli?/render",
]
slim = ["compare", "doc", "markdown", "edit", "cli"]
full = ["slim", "pdf"]
# Compatibility alias for the pre-split feature name.
redlines = ["compare"]
console-panic = ["dep:console_error_panic_hook"]
# Diagnostic-only linear-memory page counter used by the W3 bench harness.
# It is absent from the shipped default build.
memory-metrics = []

# oxml-opc has encryption/signatures disabled; zip 9 uses pure-Rust zlib-rs
# Deflate. No WASM-only source patch or native crypto backend is needed.

# Runtime-speed profile for wasm-pack: -O3 (not -Oz size). Requires binaryen on PATH.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-simd",
]

# `wasm-pack --profiling` still compiles Cargo's release profile, which strips
# the wasm name section below. Use `wasm-pack --profile profiling` instead: the
# custom wasm-pack profile keeps names through wasm-opt while Cargo's matching
# profile retains release codegen.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = [
  "-O3",
  "-g",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-simd",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

# Standalone workspace for the WASM binding; the neurotic_docx_bench consumes
# it via a gitignored symlink. All bindings use the root OPC dependency.
[workspace]

[package]
name = "jubarte-wasm"
version = "0.11.3"
edition = "2024"
publish = false
description = "wasm-bindgen bindings for jubarte-redlines compare_documents (Word-mode redline)"
license = "AGPL-3.0-only"
repository = "https://github.com/jandira-tech/jubarte-redlines"

[lib]
name = "jubarte_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
jubarte-redlines = { path = "..", default-features = false }
wasm-bindgen = "0.2"
serde = "1"
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console-panic", "pdf"]
console-panic = ["dep:console_error_panic_hook"]
# DOCX→PDF exports (docxToPdf / pdfPageCount). Referencing the PDF writer
# links in rustybuzz shaping, the image decoders, and the embedded
# Carlito/Liberation fonts (~7.5 MB of wasm). The npm package's *-slim
# builds turn this off for consumers that do not need PDF rendering.
pdf = []
# Diagnostic-only linear-memory page counter used by the W3 bench harness.
# It is absent from the shipped default build.
memory-metrics = []

# rdocx-opc 0.2 uses pure-Rust deflate and patched quick-xml upstream, so the
# old WASM-only source patch is no longer needed.

# Runtime-speed profile for wasm-pack: -O3 (not -Oz size). Requires binaryen on PATH.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-simd",
]

# `wasm-pack --profiling` still compiles Cargo's release profile, which strips
# the wasm name section below. Use `wasm-pack --profile profiling` instead: the
# custom wasm-pack profile keeps names through wasm-opt while Cargo's matching
# profile retains release codegen.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = [
  "-O3",
  "-g",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-simd",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

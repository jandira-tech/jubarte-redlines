# Standalone workspace so this binding does not join the engine crate's
# workspace (mirrors jubarte-wasm). Published to PyPI (as `jubarte-redlines`),
# never to crates.io.
[workspace]

[package]
name = "jubarte-python"
version = "0.15.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "PyO3 bindings for jubarte-redlines: Word-mode DOCX redline compare, accept/reject/list revisions, DOCX→PDF"
license = "AGPL-3.0-only"
repository = "https://github.com/jandira-tech/jubarte-redlines"


[package.metadata.release-notes]
"0.9.2" = "docx_to_pdf gains revisions= and revision_palette=; PDFs follow Word's layout more closely and are smaller. Redline output unchanged."

"0.9.3" = "Redlines Word refused to open now open. A field whose code changed is replaced whole, and a same-code field stays whole, as in Word's redline. Table, list and section markup follow Word, and the same input writes the same bytes."
"0.10.0" = "jubarte_redlines.read() returns a Document with inspect, edit, convert, compare and accept/reject; python -m jubarte_redlines exposes the same commands; EditPlan builds paragraph formatting, joins, whole replacements and header/footer/note edits."
"0.10.1" = "List, accept or reject tracked changes one at a time (list_changes, accept_changes, reject_changes, and resolve_revisions in edit plans), Word-parity Reject All, and much closer-to-Word docx-to-PDF pagination, tables, headers and footers."
"0.11.0" = "Document.audit, validate, repair, scrub, append, comments, diff and update_fields; EditPlan gains rewrite, insert_table, list_paragraphs, format_run, insert_footnote, insert_image, page_setup, fill_control, insert_toc and update_fields=True; compare_documents(input_limits=...); a jubarte-mcp MCP server; uvx jubarte-redlines runs the CLI; wheels for Windows x86_64 and musl Linux."
"0.11.2" = "Redlines follow Word's own rule for marking a changed paragraph word by word or replacing it whole; docx_to_pdf paints comments as Word's balloons and follows Word's layout more closely. On two 600-item samples scored against Word's own output: redlines mean 76.71 (Docxodus 69.24), PDFs mean 78.77 (LibreOffice 54.06), no failed item."
"0.11.3" = "docx_to_pdf sets OMML math in Cambria Math as Word does; the font report counts a guessed face as substituted; a repeated identical relationship Id opens repaired; MSRV 1.94. On two 600-item samples scored against Word's own output: redlines mean 72.06 (Docxodus 65.15), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.14 (LibreOffice 54.61), no failed document."
"0.12.0" = "Agent view and text diff views, PdfOptions(move_comments=..., changed_only=...) for to_pdf, to_png, render and docx_to_pdf, python -m jubarte_redlines read/edit/add/convert with the native CLI's flags, and redline fixes for files Word 16.115 hung on; PDF text no font covers stays searchable; the macOS extension is no longer symbol-stripped. On two 600-item samples scored against Word's own output: redlines mean 71.89 (Docxodus 64.95), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.19 (LibreOffice 54.61), no failed document."
"0.13.0" = "replace keeps the words it keeps; one logical change per edit (Change.members, composite ids); skip-failed edits in the CLI; visible rejects (strike, restore); Word math as LaTeX and Markdown round-trips for charts, fields and images; docx_to_pdf lays out math, columns and header PAGE fields; Strict OOXML read and compared as itself; malformed ZIP packages refused (GHSA-m665-v7pm-7grj). On two 600-item samples scored against Word's own output: redlines mean 71.63 (Docxodus 64.92), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.19 (LibreOffice 54.61), no failed document."
"0.14.0" = "`read -p` repeats, `read --tables -o FILE` writes the grids, `changes --author NAME` filters, and `validate --repair` says what it checked. Tracked edits keep formatting history apart and refuse duplicate revision ids; table redlines avoid the final-mark revision that hangs Word. Known: 3 of 600 sample redlines crash Word 16.115 where Word's own does not (#1802)."
"0.15.0" = "Word-mode tables now pair, split and mesh as Word Compare does; validate with an original checks comments (FOREIGN_COMMENT); comments and edits no longer restyle or renumber what they did not touch; redlines with deleted page-numbered footers open in Word."
[lib]
name = "jubarte_python"
crate-type = ["cdylib"]

[dependencies]
# Shared CLI grammar, without the engine's default allocator features.
jubarte-redlines = { path = "..", default-features = false, features = ["cli"] }
# abi3-py310: one wheel per platform covers every CPython >= 3.10.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
serde_json = "1" # structured results cross the boundary as engine-produced JSON

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Symbol stripping can corrupt Mach-O LINKEDIT alignment on macOS.
strip = "none"

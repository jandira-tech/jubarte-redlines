# The former name of jubarte's Python package, kept as a shim. The engine
# ships as `jubarte-docx` (import `jubarte`, command `jubarte`); this
# distribution owns only `jubarte_redlines/`, which re-exports `jubarte`,
# and the `jubarte-redlines` command, so `pip install -U jubarte-redlines`,
# `import jubarte_redlines` and `uvx jubarte-redlines` keep working and no
# file belongs to both distributions. scripts/release.sh step 1 moves the
# version and the pin together.
[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "jubarte-redlines"
version = "0.19.0"
description = "Former name of jubarte-docx, the Word-faithful DOCX redline engine: installs jubarte-docx and keeps import jubarte_redlines working"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jandira Technologies, LLC", email = "arthur@jandira.tech" }]
maintainers = [{ name = "Jandira Technologies, LLC", email = "arthur@jandira.tech" }]
keywords = ["docx", "redline", "track-changes", "tracked-changes", "word", "microsoft-word", "compare", "jubarte", "jubarte-docx"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = ["jubarte-docx==0.19.0"]

[project.optional-dependencies]
mcp = ["jubarte-docx[mcp]==0.19.0"]

[project.scripts]
jubarte-redlines = "jubarte.__main__:main"

[project.urls]
Homepage = "https://github.com/jandira-tech/jubarte"
Documentation = "https://github.com/jandira-tech/jubarte/blob/main/docs/python.md"
Repository = "https://github.com/jandira-tech/jubarte"
Changelog = "https://github.com/jandira-tech/jubarte/blob/main/CHANGELOG.md"
Issues = "https://github.com/jandira-tech/jubarte/issues"

[tool.uv.build-backend]
module-name = "jubarte_redlines"
module-root = ""

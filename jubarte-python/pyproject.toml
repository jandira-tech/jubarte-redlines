[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "jubarte-redlines"
description = "Word-faithful DOCX redline engine — compare two Word documents into a tracked-changes document that opens cleanly in Microsoft Word; list, accept, or reject revisions; render DOCX to PDF"
# release-notes v0.16.0 — Breaking: changes/comments --json print records only on stdout, and input_validity goes to stderr. validate finds more broken relationships and nameless move ranges; PDF tables past their grid take Word's widths; rewrites under keep mark one change per phrase.
# release-notes v0.15.0 — Word-mode tables now pair, split and mesh as Word Compare does; validate with an original checks comments (FOREIGN_COMMENT); comments and edits no longer restyle or renumber what they did not touch; redlines with deleted page-numbered footers open in Word.
# release-notes v0.14.0 — `read -p` repeats, `read --tables -o FILE` writes the grids, `changes --author NAME` filters, and `validate --repair` says what it checked. Tracked edits keep formatting history apart and refuse duplicate revision ids; table redlines avoid the final-mark revision that hangs Word. Known: 3 of 600 sample redlines crash Word 16.115 where Word's own does not (#1802).
# release-notes v0.13.0 — replace keeps the words it keeps; one logical change per edit (Change.members, composite ids); skip-failed edits in the CLI; visible rejects (strike, restore); Word math as LaTeX and Markdown round-trips for charts, fields and images; docx_to_pdf lays out math, columns and header PAGE fields; Strict OOXML read and compared as itself; malformed ZIP packages refused (GHSA-m665-v7pm-7grj). On two 600-item samples scored against Word's own output: redlines mean 71.63 (Docxodus 64.92), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.19 (LibreOffice 54.61), no failed document.
# release-notes v0.12.0 — Agent view and text diff views, PdfOptions(move_comments=..., changed_only=...) for to_pdf, to_png, render and docx_to_pdf, python -m jubarte_redlines read/edit/add/convert with the native CLI's flags, and redline fixes for files Word 16.115 hung on; PDF text no font covers stays searchable; the macOS extension is no longer symbol-stripped. On two 600-item samples scored against Word's own output: redlines mean 71.89 (Docxodus 64.95), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.19 (LibreOffice 54.61), no failed document.
# release-notes v0.11.3 — docx_to_pdf sets OMML math in Cambria Math as Word does; the font report counts a guessed face as substituted; a repeated identical relationship Id opens repaired; MSRV 1.94. On two 600-item samples scored against Word's own output: redlines mean 72.06 (Docxodus 65.15), counting as 0 the 23 redlines Word 16.115 crashes opening (KNOWN_ISSUES #8); PDFs mean 79.14 (LibreOffice 54.61), no failed document.
# release-notes v0.11.2 — Redlines follow Word's own rule for marking a changed paragraph word by word or replacing it whole; docx_to_pdf paints comments as Word's balloons and follows Word's layout more closely. On two 600-item samples scored against Word's own output: redlines mean 76.71 (Docxodus 69.24), PDFs mean 78.77 (LibreOffice 54.06), no failed item.
# release-notes v0.11.0 — Document.audit, validate, repair, scrub, append, comments, diff and update_fields; EditPlan gains rewrite, insert_table, list_paragraphs, format_run, insert_footnote, insert_image, page_setup, fill_control, insert_toc and update_fields=True; compare_documents(input_limits=...); a jubarte-mcp MCP server; uvx jubarte-redlines runs the CLI; wheels for Windows x86_64 and musl Linux.
# release-notes v0.10.1 — List, accept or reject tracked changes one at a time (list_changes, accept_changes, reject_changes, and resolve_revisions in edit plans), Word-parity Reject All, and much closer-to-Word docx-to-PDF pagination, tables, headers and footers.
# release-notes v0.10.0 — jubarte_redlines.read() returns a Document with inspect, edit, convert, compare and accept/reject; python -m jubarte_redlines exposes the same commands; EditPlan builds paragraph formatting, joins, whole replacements and header/footer/note edits.
# release-notes v0.9.3 — Redlines Word refused to open now open. A field whose code changed is replaced whole, and a same-code field stays whole, as in Word's redline. Table, list and section markup follow Word, and the same input writes the same bytes.
# release-notes v0.9.2 — docx_to_pdf gains revisions= and revision_palette=; PDFs follow Word's layout more closely and are smaller. Redline output unchanged.
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Jandira Technologies, LLC" }]
keywords = ["docx", "redline", "track-changes", "tracked-changes", "word", "microsoft-word", "openxml", "ooxml", "compare", "diff", "pdf", "docx-to-pdf", "markdown", "criticmarkup", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
# Version comes from Cargo.toml (single source of truth).
dynamic = ["version"]

# `uvx jubarte-redlines redline a.docx b.docx -o redline.docx`
[project.scripts]
jubarte-redlines = "jubarte_redlines.__main__:main"
# `uvx --from 'jubarte-redlines[mcp]' jubarte-mcp --root .`
jubarte-mcp = "jubarte_redlines.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/jandira-tech/jubarte-redlines"
Repository = "https://github.com/jandira-tech/jubarte-redlines"
Changelog = "https://github.com/jandira-tech/jubarte-redlines/blob/main/CHANGELOG.md"
Issues = "https://github.com/jandira-tech/jubarte-redlines/issues"

[tool.maturin]
module-name = "jubarte_redlines._native"
python-source = "python"
# Leave native extension symbols intact: macOS symbol stripping can
# produce an invalid Mach-O LINKEDIT string pool and prevent import.
strip = false
# The sdist vendors the engine checkout (path dep on ".."); keep sibling
# adapters, local build output, and app junk out of it.
exclude = [
  { path = "wheels/**", format = "sdist" },
  { path = "dist/**", format = "sdist" },
  { path = "jubarte-app/**", format = "sdist" },
  { path = "jubarte-wasm/**", format = "sdist" },
  { path = "jubarte-rust-inproc/**", format = "sdist" },
  { path = "../jubarte-app/**", format = "sdist" },
  { path = "../jubarte-wasm/**", format = "sdist" },
  { path = "../jubarte-rust-inproc/**", format = "sdist" },
]

# Standalone `arthrod/jubarte-app` workflow, vendored with the app tree.
# GitHub does not run nested `.github/workflows/` — this file is a no-op on
# `jandira-tech/jubarte-redlines`. The monorepo CI is the repo-root
# `.github/workflows/ci.yml`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The app depends on the AGPL engine via a path relative to the monorepo layout:
#   jubarte-rs/jubarte-app/src-tauri  →  jubarte = { path = "../.." }
# CI recreates that layout by checking out both private repos nested.
jobs:
  rust:
    name: fmt + clippy + check + test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: engine/jubarte-app/src-tauri
    steps:
      - name: Checkout engine (jandira-tech/jubarte-redlines)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jandira-tech/jubarte-redlines
          path: engine
          persist-credentials: false
          # Fine-grained PAT with Contents: Read on jandira-tech/jubarte-redlines
          # (secret JUBARTE_RS_TOKEN, name leftover). Falls back to github.token
          # when the workflow is allowed to read that repo.
          token: ${{ secrets.JUBARTE_RS_TOKEN || github.token }}

      - name: Checkout app into engine/jubarte-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: engine/jubarte-app
          persist-credentials: false

      # rustup ships on the macOS runner image; no third-party action needed.
      # The toolchain is Cargo.toml's `rust-version`, so it moves only with it.
      - name: Rust toolchain (MSRV from Cargo.toml)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --component rustfmt,clippy
          rustup override set "$msrv"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine/jubarte-app/src-tauri -> target

      - name: rustfmt
        run: cargo fmt --all -- --check

      # correctness is deny in Cargo.toml; style/perf stay warn until cleaned up.
      - name: clippy
        run: cargo clippy --all-targets -- -D clippy::correctness

      - name: check
        run: cargo check --all-targets

      - name: test
        run: cargo test --all-targets

      - name: line coverage ≥ 80% (business logic)
        # Tauri shell (`main.rs`), the StoreKit FFI wrappers and the AppKit Finder
        # service (`finder_service.rs`) need a real App Store/AppKit
        # context; gate the pure free-quota module which carries the money path.
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version 0.9.1 || true
          cargo llvm-cov --fail-under-lines 80 \
            --ignore-filename-regex 'main\.rs|storekit\.rs|finder_service\.rs' \
            --summary-only

  # The Linux jobs run on GitHub's runner and on the self-hosted one
  # (coolify-runner, labels self-hosted/Linux/X64/default), so a check still
  # runs when either is unavailable. The macOS job above stays on GitHub's
  # macOS runner: the app builds against AppKit and StoreKit.
  frontend:
    name: frontend lockfile (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, self-hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's installer runs on whatever Node the runner has; the
      # self-hosted runner's is too old (no `node:path`), so Node comes first.
      # The second setup-node below caches the store, which needs pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Package scripts present
        run: |
          test -f package.json
          test -f src/index.html
          test -f src-tauri/tauri.conf.json

  # The three Workers keep their own lockfiles, which the job above never
  # installs: a Renovate PR touching only them used to pass with nothing run.
  workers:
    name: workers (${{ matrix.dir }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, self-hosted]
        dir: [jubarte-site, redlines-site, verify-worker]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's installer runs on whatever Node the runner has; the
      # self-hosted runner's is too old (no `node:path`), so Node comes first.
      # The second setup-node below caches the store, which needs pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      # The site's build needs the HF fixtures (build.ts fails closed without
      # them), so CI runs its Node project, not the workerd one, and skips
      # cache.test.ts, which reads the built public/.
      - name: Test
        run: ${{ matrix.dir == 'jubarte-site' && 'pnpm exec vitest run --project unit --exclude test/node/cache.test.ts' || 'pnpm test' }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Night: jubarte.pro's whale mark (site/layout.ts WHALE_BODY, WHALE_FIN),
       flat, on the site's Night colours (its dark-mode background, primary and ink
       colours). The plate is macOS's 824 px rounded square in a 1024 canvas. -->
  <defs>
    <linearGradient id="night" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A2735"/>
      <stop offset="1" stop-color="#0B121A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#7FC4F0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7FC4F0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect x="100" y="100" width="824" height="824" fill="url(#night)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <g transform="translate(512 486) scale(1.32) translate(-308 -209)">
      <g transform="rotate(-5 280 200)">
        <path d="M 76 192 C 82 172 112 156 150 146 C 196 132 258 112 310 110 C 356 108 402 118 448 148 C 458 152 464 150 470 144 C 478 128 494 106 520 92 C 512 112 508 126 502 134 C 514 140 526 148 540 160 C 520 164 498 160 480 162 C 470 164 460 166 452 166 C 420 190 382 228 328 252 C 270 278 194 286 148 268 C 114 254 88 230 81 208 C 76 198 74 194 76 192 Z" fill="#7FC4F0"/>
        <path d="M 208 228 C 246 240 286 268 322 298 C 334 308 338 320 330 326 C 296 326 254 306 226 280 C 206 260 200 240 208 228 Z" fill="#EEF3F7"/>
        <circle cx="122" cy="196" r="6" fill="#0E1720"/>
      </g>
    </g>

    <!-- its wake -->
    <path d="M 300 704 C 420 730 600 730 724 696" stroke="#7FC4F0" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>

# Jubarte desktop app — proprietary Tauri shell over the open-source
# `jubarte` engine (AGPL core: github.com/arthrod/jubarte-rs).
#
# Layout (required for the path dependency below):
#   jubarte-rs/                 ← engine crate root
#   jubarte-rs/jubarte-app/     ← this repo, git submodule
#   jubarte-rs/jubarte-app/src-tauri/
#
# Develop via the engine monorepo + submodule (see README). Do not `cargo
# publish` this package.

# Empty workspace so Cargo does not join an enclosing workspace.
[workspace]

[package]
name = "jubarte-app"
version = "0.11.2"
edition = "2024"
rust-version = "1.90"
publish = false
license = "LicenseRef-Proprietary"
description = "Proprietary Jubarte desktop shell (Tauri) over the jubarte redline engine"
repository = "https://github.com/arthrod/jubarte-app"
readme = "../README.md"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# StoreKit bridge is macOS-only; swift-rs compiles/links the Swift static lib.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.8", features = ["build"] }

[dependencies]
# protocol-asset: the window shows a converted PDF from the app's cache
# (tauri.conf.json scopes it to $APPCACHE/conversions).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
# Path to the enclosing engine checkout when this repo is the `jubarte-app`
# submodule of arthrod/jubarte-rs. Once `jubarte` is on crates.io, prefer:
#   jubarte = { version = "0.x", default-features = false }
jubarte = { package = "jubarte-redlines", path = "../..", default-features = false }

# Runtime FFI glue to the Swift StoreKit 2 helper (Mac App Store builds only),
# and the AppKit bindings for the Finder "Redline with Jubarte" service (the
# same objc2 crates tauri already links).
[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0.8"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSResponder"] }

# `tauri::test` mock runtime for the Finder hand-off tests.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Builds the conversion tests' document; the engine already links this zip.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# The menu tests parse each shortcut as AppKit's menus will (tauri uses muda
# but does not re-export its Accelerator); a bad one would fail the launch.
muda = { version = "0.20", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Group priorities must be unique (clippy::lint_groups_priority).
# Start from a green baseline on the existing Tauri shell; tighten over time.
[lints.rust]
future-incompatible = { level = "warn", priority = 0 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -2 }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -2 }
style = { level = "warn", priority = -3 }
complexity = { level = "warn", priority = -4 }
perf = { level = "warn", priority = -5 }

# Jubarte desktop app — closed-source Tauri shell over the open-source
# `jubarte` engine (AGPL core lives in github.com/arthrod/jubarte-rs).

# Standalone workspace: shields the crate from the enclosing ooxmlsdk
# workspace while this checkout sits nested inside that repo.
[workspace]

[package]
name = "jubarte-app"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.40"
# Local checkout during development; switch to the crates.io release once
# `jubarte` is published.
jubarte = { path = "../../jubarte-rs", default-features = false }

[profile.release]
lto = true
codegen-units = 1

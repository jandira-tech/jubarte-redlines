# CI writes JUnit XML (target/nextest/ci/junit.xml) for Codecov's test
# results: libtest (`cargo test`) writes none.
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# `cargo miri nextest run`, the rare full run (AGENTS.md): Miri interprets
# every test, so a slow one is stopped rather than left to hang the run.
[profile.default-miri]
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 4 }

# This integration benchmark measures wall time. Reserve the run's worker
# slots so unrelated integration tests cannot consume its CPU budget.
[[profile.default.overrides]]
filter = 'test(foreign_reverse_ten_thousand_revisions_is_fast)'
threads-required = "num-cpus"
